<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<meta name="referrer" content="no-referrer">
<title>EAH SPORT | Personal Coaching Experience</title>

<style>
:root{
  --bg:#07111e;
  --panel:#101f32;
  --panel2:#162b43;
  --blue:#087ff5;
  --light:#78bfff;
  --white:#ffffff;
  --muted:#9db2c9;
  --border:#263e58;
  --green:#39d99a;
  --orange:#ffb45b;
  --red:#ff7777;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:115px}

body{
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
a{color:var(--light);text-decoration:none}
h1,h2,h3,p{margin-top:0}

h1{
  font-size:clamp(38px,6vw,76px);
  line-height:1.08;
  letter-spacing:-2px;
  margin-bottom:22px;
}

h2{
  font-size:clamp(26px,4vw,40px);
  line-height:1.2;
  letter-spacing:-.8px;
  margin-bottom:12px;
}

h3{font-size:21px;margin-bottom:8px}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,17,30,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  padding:16px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  color:white;
  flex-shrink:0;
}

.brand img{width:58px;height:58px;object-fit:contain}

.brand-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:3px;
  line-height:1.2;
}

.brand-title span{color:var(--blue)}

.brand-subtitle{
  font-size:9px;
  letter-spacing:1.6px;
  color:var(--muted);
}

.header-nav{display:flex;align-items:center;gap:24px}
.header-nav a{color:#d0deec;font-size:13px;font-weight:700}
.header-nav a:hover{color:var(--light)}
.status{font-size:11px;color:var(--green);white-space:nowrap}

main{
  max-width:1450px;
  margin:auto;
  padding:24px 25px 70px;
  min-height:80vh;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2.4px;
  font-weight:800;
  color:var(--light);
  text-transform:uppercase;
}

.muted{color:var(--muted)}
.small{font-size:12px}
.success{color:var(--green)}
.error{color:var(--red);overflow-wrap:anywhere}

.hero{
  position:relative;
  overflow:hidden;
  min-height:510px;
  display:flex;
  align-items:center;
  padding:65px;
  border:1px solid var(--border);
  border-radius:26px;
  background:
    linear-gradient(
      90deg,
      rgba(5,15,28,.99) 0%,
      rgba(5,15,28,.93) 32%,
      rgba(5,15,28,.45) 75%,
      rgba(5,15,28,.25) 100%
    ),
    url('images/bandeau-sport.webp') center/cover,
    linear-gradient(135deg,#122a45,#15579a);
}

.hero-content{position:relative;z-index:2;max-width:700px}
.hero h1 span{color:var(--light)}
.hero p{max-width:570px;font-size:17px;color:#bdcde0}
.hero .eyebrow{margin-bottom:20px}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:14px 23px;
  border:1px solid transparent;
  border-radius:10px;
  background:linear-gradient(135deg,#1995ff,#0865d2);
  color:white;
  font-size:13px;
  font-weight:800;
  transition:.2s;
  text-decoration:none;
}

.btn:hover:not(:disabled){
  filter:brightness(1.15);
  transform:translateY(-2px);
}

.btn-secondary{background:#142a42;border-color:#385470}
.full{width:100%}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:22px 0 55px;
}

.feature{
  display:flex;
  align-items:center;
  gap:18px;
  padding:25px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}

.feature-icon{
  width:50px;
  height:50px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:#153a60;
  border-radius:13px;
  color:var(--light);
}

.feature-icon svg{width:27px;height:27px}
.feature strong{display:block;font-size:19px}
.feature small{color:var(--muted)}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:25px 0;
}

.section-heading h2{margin:7px 0}

.search-bar{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:13px;
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #35516e;
  background:#0b1a2a;
  color:white;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #087ff522;
}

input::placeholder,textarea::placeholder{color:#829ab3}
textarea{resize:vertical;min-height:110px}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter-btn{
  padding:9px 17px;
  background:#112338;
  color:#b7cbe0;
  border:1px solid var(--border);
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.filter-btn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}

.exercise-card{
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  overflow:hidden;
  transition:transform .25s,border-color .25s;
}

.exercise-card:hover{
  transform:translateY(-5px);
  border-color:#4d93d4;
}

.exercise-image-button{
  position:relative;
  display:block;
  width:100%;
  padding:0;
  border:0;
  background:#142d49;
  overflow:hidden;
  color:white;
}

.exercise-photo{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  transition:transform .4s;
}

.exercise-image-button:hover img{transform:scale(1.06)}

.photo-placeholder{
  width:100%;
  aspect-ratio:4/3;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#1a416a,#0b1a2c);
  color:#72bbff;
}

.photo-placeholder svg{width:75px;height:75px}

.play-overlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.3));
}

.play-circle{
  display:grid;
  place-items:center;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(4,13,24,.65);
  border:2px solid #ffffffcc;
  font-size:22px;
  padding-left:4px;
  backdrop-filter:blur(5px);
  transition:.2s;
}

.exercise-image-button:hover .play-circle{
  background:var(--blue);
  transform:scale(1.1);
}

.photo-label{
  position:absolute;
  bottom:13px;
  left:13px;
  background:rgba(0,0,0,.75);
  padding:6px 10px;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.exercise-body{
  padding:22px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.exercise-body h3{margin-top:8px}

.exercise-description{
  color:var(--muted);
  font-size:13px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:42px;
}

.exercise-body .btn{margin-top:auto}

.muscles{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0 15px;
}

.muscle{
  background:#173c60;
  color:#a5d4ff;
  padding:5px 10px;
  border-radius:6px;
  font-size:11px;
}

.panel{
  padding:25px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  margin-bottom:20px;
}

.coaching-banner{
  margin-top:55px;
  padding:45px;
  display:grid;
  grid-template-columns:1.5fr 1fr;
  align-items:center;
  gap:30px;
  background:linear-gradient(135deg,#15385e,#102033);
  border:1px solid #31577d;
  border-radius:25px;
}

.nfc-card{
  width:100%;
  max-width:330px;
  aspect-ratio:1.586;
  margin:auto;
  padding:24px;
  border-radius:17px;
  border:1px solid #5684b5;
  background:
    radial-gradient(circle at 100% 0%,#287ac8,transparent 65%),
    linear-gradient(135deg,#081a32,#153c65);
  box-shadow:0 20px 40px #0006;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.nfc-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nfc-card img{width:48px;height:48px;object-fit:contain}

.nfc-card-title{
  font-size:28px;
  letter-spacing:3px;
  font-weight:900;
}

.nfc-card-title span{color:var(--light)}
.nfc-symbol{font-size:24px;color:var(--light)}
.nfc-card small{font-size:9px;letter-spacing:2px;color:#bed8f1}

.profile-hero{
  padding:35px;
  border-radius:23px;
  border:1px solid #315b88;
  background:linear-gradient(135deg,#17395e,#0b1a2c);
  margin-bottom:25px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:20px;
  margin:20px 0;
}

.profile-head h1{
  font-size:clamp(27px,5vw,45px);
  letter-spacing:-1px;
  margin:0;
}

.avatar,.avatar-placeholder{
  width:95px;
  height:95px;
  border-radius:50%;
  border:3px solid var(--light);
  background:#1c4269;
  flex-shrink:0;
}

.avatar{object-fit:cover}

.avatar-placeholder{
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
}

.coach-message{
  white-space:pre-wrap;
  border-left:3px solid var(--light);
  background:#ffffff0b;
  padding:18px;
  border-radius:0 10px 10px 0;
  margin:20px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#ffffff0c;
  border:1px solid #ffffff18;
  padding:17px;
  border-radius:12px;
}

.stat span{
  color:#bad0e7;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.stat strong{display:block;font-size:clamp(20px,4vw,30px)}

.member-nav{
  display:flex;
  gap:10px;
  margin:25px 0;
  overflow-x:auto;
}

.nav-btn{
  flex:1;
  min-width:max-content;
  padding:14px 18px;
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:10px;
  font-weight:bold;
}

.nav-btn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.session-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:22px;
}

.session-header{
  padding:25px;
  background:linear-gradient(135deg,#1a426d,#102238);
}

.session-content{padding:16px}

.session-exercise{
  background:#0b1b2d;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}

.session-exercise:last-child{margin-bottom:0}

.session-exercise.is-success{border-color:#39d99a66}
.session-exercise.is-failed{border-color:#ff777766}

.session-exercise summary{
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  list-style:none;
}

.session-exercise summary::-webkit-details-marker{display:none}

.exercise-number{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  background:#1a3e65;
  color:var(--light);
  border-radius:10px;
  flex-shrink:0;
  font-weight:bold;
}

.summary-info{flex:1;min-width:0}
.summary-info strong{display:block;overflow-wrap:anywhere}
.summary-info small{color:var(--muted)}

.summary-arrow{
  color:var(--light);
  font-size:20px;
  transition:transform .2s;
}

details[open] .summary-arrow{transform:rotate(180deg)}

.details-body{
  padding:20px;
  border-top:1px solid var(--border);
}

.details-body .exercise-image-button{
  max-width:500px;
  border-radius:12px;
}

.details-body>.exercise-photo{
  max-width:500px;
  border-radius:12px;
}

.table-wrap{overflow-x:auto;margin:15px 0}

table{
  width:100%;
  min-width:280px;
  border-collapse:collapse;
}

td,th{
  padding:12px 10px;
  text-align:center;
  border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

th{
  background:#1b4067;
  color:#b7dfff;
  font-size:11px;
  text-transform:uppercase;
}

td{font-size:14px}
tr:nth-child(even) td{background:#132b43}

.form-card{max-width:720px;margin:25px auto}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.field{margin-bottom:18px}

label{
  display:block;
  margin-bottom:7px;
  color:#c9dbec;
  font-size:13px;
  font-weight:bold;
}

.activation-heading{text-align:center;margin-bottom:25px}
.activation-heading img{width:85px;margin-bottom:15px}

.photo-preview{
  display:none;
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--blue);
  margin:0 auto 20px;
}

.consent{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-weight:normal;
  color:var(--muted);
}

.consent input{width:auto;margin-top:5px}

.profile-line{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;
}

.profile-line span{color:var(--muted)}
.profile-line strong{text-align:right}

.empty{
  padding:35px 20px;
  border:1px dashed #365876;
  border-radius:14px;
  color:var(--muted);
  text-align:center;
}

.notice{
  padding:13px 16px;
  background:#122a43;
  border:1px solid #294968;
  border-radius:10px;
  color:#a9c6e1;
  font-size:12px;
  margin-bottom:20px;
}

.loading{padding:90px 20px;text-align:center}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #24415e;
  border-top-color:var(--blue);
  border-radius:50%;
  margin:0 auto 20px;
  animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  padding:25px;
  background:#000c;
  backdrop-filter:blur(8px);
  overflow-y:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.modal-inner{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:28px;
  background:var(--panel);
  border:1px solid #375a7c;
  border-radius:22px;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.modal-top h2{margin:6px 0}

.modal-inner .exercise-photo{
  max-height:450px;
  border-radius:12px;
}

.close{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:1px solid var(--border);
  background:#1b3653;
  color:white;
  border-radius:10px;
  font-size:25px;
}

.video-frame{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
  background:#03080e;
  margin:15px 0;
}

.video-preview{
  padding:35px 20px;
  text-align:center;
  background:#081421;
  border:1px solid var(--border);
  border-radius:12px;
  margin:15px 0;
}

/* ========================================================
   NOUVEAU : APPRECIATIONS ET SUIVI SPORTIF
   ======================================================== */

.feedback-panel{
  margin-top:25px;
  padding:22px;
  background:linear-gradient(145deg,#132b43,#101f32);
  border:1px solid #34536f;
  border-radius:16px;
}

.feedback-title{
  font-size:21px;
  margin:7px 0;
}

.feedback-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:15px 0 22px;
}

.feedback-option{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60px;
  margin:0;
  padding:12px;
  border-radius:11px;
  cursor:pointer;
  font-weight:800;
  font-size:14px;
  transition:.2s;
}

.feedback-option input{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
}

.feedback-option:focus-within{
  outline:2px solid var(--light);
  outline-offset:3px;
}

.feedback-option.good{
  color:var(--green);
  background:#39d99a0b;
  border:1px solid #39d99a55;
}

.feedback-option.bad{
  color:var(--red);
  background:#ff77770b;
  border:1px solid #ff777755;
}

.feedback-option.good:has(input:checked){
  background:#174c38;
  border-color:var(--green);
  box-shadow:0 0 0 2px #39d99a22;
}

.feedback-option.bad:has(input:checked){
  background:#54262d;
  border-color:var(--red);
  box-shadow:0 0 0 2px #ff777722;
}

.feedback-option:hover{filter:brightness(1.2)}

.feedback-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.feedback-status.pending{
  background:#ffb45b12;
  color:var(--orange);
  border:1px solid #ffb45b33;
}

.feedback-status.good{
  background:#39d99a15;
  color:var(--green);
  border:1px solid #39d99a44;
}

.feedback-status.bad{
  background:#ff777715;
  color:var(--red);
  border:1px solid #ff777744;
}

.feedback-message{
  font-size:13px;
  margin:12px 0 0;
  overflow-wrap:anywhere;
}

.feedback-date{
  font-size:11px;
  color:var(--muted);
  margin:12px 0;
}

.feedback-platforms{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:10px 0;
}

.platform-tag{
  font-size:10px;
  font-weight:bold;
  padding:5px 9px;
  border-radius:6px;
  background:#1a3652;
  color:#b4d7f8;
  border:1px solid #34536f;
}

.progress-track{
  height:7px;
  background:#ffffff18;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#087ff5,#39d99a);
  border-radius:20px;
  transition:width .3s;
}

.progress-info{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
  color:#c2d6e9;
  margin-top:15px;
}

.session-stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.session-stat{
  padding:5px 10px;
  border-radius:7px;
  background:#ffffff0b;
  font-size:11px;
  font-weight:bold;
}

.custom-tag{
  display:inline-block;
  color:var(--light);
  font-size:10px;
  padding:4px 8px;
  background:#1b4067;
  border-radius:6px;
  margin:6px 0;
}

.video-saved{
  padding:12px;
  border:1px solid #35516e;
  background:#0b1a2a;
  border-radius:10px;
  margin:10px 0 15px;
}

.video-saved a{
  overflow-wrap:anywhere;
  font-size:12px;
}

.comment-counter{
  font-size:10px;
  text-align:right;
  color:var(--muted);
  margin-top:4px;
}

footer{
  padding:45px 20px;
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
}

function esc(value){

  return String(value??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

function normalize(value){

  return String(value??'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();

}

function first(object,keys,fallback=''){

  for(const key of keys){

    if(
      object&&
      object[key]!==undefined&&
      object[key]!==null&&
      object[key]!==''
    ){
      return object[key];
    }

  }

  return fallback;

}

function safeUrl(value){

  try{

    const u=new URL(String(value||'').trim());

    return (
      u.protocol==='https:'&&
      !u.username&&
      !u.password
    )?u.href:'';

  }catch{

    return '';

  }

}

function isActive(value){

  return [
    'true','1','oui','actif','active','activee',
    'activated','vrai','yes'
  ].includes(normalize(value));

}

function imageUrl(value){

  const url=safeUrl(value);

  if(url){

    const u=new URL(url);

    if(u.hostname==='drive.google.com'){

      const match=u.pathname.match(/\/file\/d\/([\w-]+)/);

      const id=match?match[1]:u.searchParams.get('id');

      if(id&&/^[\w-]+$/.test(id)){

        return 'https://drive.google.com/thumbnail?id='+
          encodeURIComponent(id)+'&sz=w1200';

      }

    }

    return url;

  }

  const relative=String(value||'');

  if(/^images\/[a-zA-Z0-9_.-]+\.(webp|jpg|jpeg|png)$/i.test(relative)){

    return new URL(relative,SITE).href;

  }

  return '';

}

function safeAvatar(value){

  const v=String(value||'');

  if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)){
    return v;
  }

  return imageUrl(v);

}

function formatDate(value){

  const date=new Date(value);

  if(Number.isNaN(date.getTime()))return String(value);

  return date.toLocaleString('fr-FR',{

    month:'2-digit',
    year:'numeric',

    minute:'2-digit'
  });

}

    return 'REUSSI';

  }

  if([
    'non reussi','non reussie','failed',
    'echec','non valide','non validee','false','non'
  ].includes(v)){

    return 'NON REUSSI';

  }

  return '';

}

function normalizeExercise(e){

  const nom=first(e,[

  ]);

  const fallback=DEFAULT_EXERCISES.find(

/************************************************************
 * NORMALISATION DES APPRECIATIONS
 ************************************************************/

function normalizeFeedback(source){

  const s=source||{};

  const nested=
    s.reponse||
    s.response||
    s.feedback||
    s.appreciation||
    {};

  const r=typeof nested==='object'&&nested!==null

    :{resultat:nested};

  return {

    resultat:normalizeResult(first(s,[
      'resultat','RESULTAT',
      'appreciation','APPRECIATION',
      'result','statutReponse'
    ],first(r,[
      'resultat','RESULTAT','result',
      'appreciation','status'
    ]))),

    ]))),

    ],first(r,[

    ]))

function normalizeSession(s){

  ]);

  const exercice=autre||first(s,[

  const idExercice=String(first(s,[

    'exerciseId','idLigne','uid','id','ID'
  ]));

  const idSeance=String(first(s,[
    'idSeance','ID_SEANCE','ID SEANCE',
    'sessionId'
  ]));

  return {

    id:idExercice,

    idExercice,

    idSeance,

    nom:first(s,[
      'nom','seance','SEANCE','session','NOM_SEANCE'
    ]),

    exercice,

    personnalise:Boolean(autre)||isActive(first(s,[
      'personnalise','PERSONNALISE','custom'
    ],false)),

    groupes:first(s,[
      'groupes','GROUPES','muscles'
    ]),

    categorie:first(s,[

    ]),

    photo:first(s,[

    ]),

    notes:first(s,[
      'notes','NOTES','consignes','CONSIGNES'
    ]),

    ...normalizeFeedback(s)

  };

}

function normalizeExerciseList(list){

  if(!Array.isArray(list))return [];

  return list.filter(e=>{

    const active=first(e,[
      'active','ACTIVE','actif','ACTIF'
    ],null);

    return active===null||isActive(active);

  }).map(normalizeExercise).filter(e=>e.nom);

}

function normalizeResponse(result){

  const payload=
    result.data&&
    typeof result.data==='object'&&
    !Array.isArray(result.data)

    ?{...result,...result.data}
    :result;

  const profile=
    payload.profil||
    payload.profile||
    payload.user||
    payload.utilisateur||
    null;

  const rawStatus=normalize(first(
    payload,
    ['status','statut','STATUS','STATUT'],
    profile
      ?first(profile,['status','statut','STATUS','STATUT'])
      :''
  ));

  let status=rawStatus.toUpperCase();

  if([
    'active','actif','activee','activated'
  ].includes(rawStatus)){

    status='ACTIF';

  }

  if([
    'disponible','available','libre',
    'inactive','non active'
  ].includes(rawStatus)){

    status='DISPONIBLE';

  }

  if([
    'desactive','desactivee','disabled','bloque'
  ].includes(rawStatus)){

    status='DESACTIVE';

  }

  const sessionList=payload.sessions||payload.seances||[];

  const sessions=Array.isArray(sessionList)

    ?sessionList.filter(s=>{

      const active=first(s,[
        'active','ACTIVE','actif','ACTIF'
      ],null);

      return active===null||isActive(active);

    }).map(normalizeSession)
      .filter(s=>s.nom&&s.exercice)

    :[];

  /*
   * Prise en charge des réponses éventuellement
   * transmises dans un tableau indépendant.
   */

  const responseList=
    payload.reponses||
    payload.responses||
    [];

  if(Array.isArray(responseList)){

    const responseMap=new Map();

    responseList.forEach(r=>{

      const id=String(first(r,[
        'idExercice','ID_EXERCICE',
        'ID EXERCICE','exerciseId'
      ]));

      if(id)responseMap.set(id,r);

    });

    sessions.forEach(s=>{

      if(s.idExercice&&responseMap.has(s.idExercice)){

        const r=responseMap.get(s.idExercice);

        Object.assign(s,normalizeFeedback({
          ...r,
          videoSportif:first(r,[
            'videoSportif','VIDEO SPORTIF',
            'VIDEO_SPORTIF','video','VIDEO'
          ]),
          dateReponse:first(r,[
            'dateReponse','date','DATE'
          ])
        }));

      }

    });

  }

  return {

    status,

    id:first(payload,['id','ID','identifiant']),

    coach:first(payload,['coach','COACH']),

    profil:profile?normalizeProfile(profile):null,

    exercises:normalizeExerciseList(
      payload.exercises||payload.exercices||[]
    ),

    sessions,

    savedResponse:
      payload.savedResponse||
      payload.savedReponse||
      payload.savedFeedback||
      null,

    message:first(payload,['message','MESSAGE']),

    raw:payload

  };

}


/************************************************************
 * 6. COMMUNICATION AVEC APPS SCRIPT
 ************************************************************/

async function requestJSON(url,options={},timeout=45000){

  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    timeout
  );

  try{

    const response=await fetch(url,{

      ...options,

      redirect:'follow',

      credentials:'omit',

      cache:'no-store',

      signal:controller.signal

    });

    if(!response.ok){

      throw new Error('Erreur serveur : '+response.status);

    }

    const raw=await response.text();

    let result;

    try{

      result=JSON.parse(raw);

    }catch{

      throw new Error(
        'Réponse Apps Script non valide. Vérifiez le déploiement.'
      );

    }

    if(
      !result||
      result.ok===false||
      result.success===false
    ){

      throw new Error(
        result?.error||
        result?.message||
        'Requête refusée.'
      );

    }

    return result;

  }catch(error){

    if(error.name==='AbortError'){

      throw new Error(
        'Le serveur met trop de temps à répondre. Réessayez.'
      );

    }

    throw error;

  }finally{

    clearTimeout(timer);

  }

}

async function callAPI(action,data={}){

  if(!/^[A-Za-z0-9_-]{20,160}$/.test(token)){

    throw new Error('Lien NFC invalide.');

  }

  const result=await requestJSON(API,{

    method:'POST',

    headers:{
      'Content-Type':'text/plain;charset=UTF-8'
    },

    body:JSON.stringify({

      action,

      token,

      data

    })

  });

  return normalizeResponse(result);

}

function extractPublicExercises(result){

  const payload=result.data||result;

  const list=Array.isArray(payload)

    ?payload

    :payload.exercises||payload.exercices;

  if(!Array.isArray(list)){

    throw new Error('Bibliothèque publique indisponible.');

  }

  return normalizeExerciseList(list);

}

async function loadPublicExercises(){

  if(publicLoading)return;

  publicLoading=true;
  publicSynced=false;

  const syncButton=document.getElementById('publicRefresh');

  if(syncButton)syncButton.disabled=true;

  updatePublicNotice();

  try{

    let result;

    try{

      result=await requestJSON(
        API+'?action=exercises',
        {method:'GET'},
        12000
      );

      exercises=extractPublicExercises(result);

    }catch{

      result=await requestJSON(API,{

        method:'POST',

        headers:{
          'Content-Type':'text/plain;charset=UTF-8'
        },

        body:JSON.stringify({
          action:'exercises'
        })

      },12000);

      exercises=extractPublicExercises(result);

    }

    publicSynced=true;

  }catch{

    exercises=DEFAULT_EXERCISES.map(e=>({...e}));

    publicSynced=false;

  }finally{

    publicLoading=false;

    if(syncButton)syncButton.disabled=false;

    if(document.getElementById('exerciseList')){

      updateLibraryFilters();
      renderExerciseList();
      updatePublicNotice();

    }

    const counter=document.getElementById('exerciseCount');

    if(counter)counter.textContent=exercises.length;

  }

}

function updatePublicNotice(){

  const notice=document.getElementById('publicNotice');

  if(!notice)return;

  if(publicLoading){

    notice.hidden=false;

    notice.textContent=
      'Synchronisation de la bibliothèque sportive…';

  }else if(publicSynced){

    notice.hidden=true;

  }else{

    notice.hidden=false;

    notice.textContent=
      'Bibliothèque de découverte. Les tutoriels du coach seront disponibles lorsque la synchronisation publique sera accessible.';

  }

}

function videoHTML(value){

  const link=safeUrl(value);

  if(!link){

    return `
      <div class="video-preview">

        <div style="font-size:40px;color:#72bbff">▶</div>

        <h3>Tutoriel bientôt disponible</h3>

        <p class="small muted">
          La vidéo sera affichée lorsque son lien sera disponible.
        </p>

      </div>
    `;

  }

  const u=new URL(link);

  const host=u.hostname.toLowerCase();

  let embed='';
  let id='';
  let platform='la vidéo';

  if(host==='youtu.be'){

    id=u.pathname.split('/')[1]||'';

  }

  if([
    'youtube.com',
    'www.youtube.com',
    'm.youtube.com',
    'www.youtube-nocookie.com'
  ].includes(host)){

    id=u.searchParams.get('v')||'';

    if(!id){

      const match=u.pathname.match(
        /^\/(?:shorts|embed|live)\/([\w-]+)/
      );

      if(match)id=match[1];

    }

  }

  if(/^[A-Za-z0-9_-]{11}$/.test(id)){

    platform='YouTube';

    embed='https://www.youtube-nocookie.com/embed/'+id;

  }

  if(host==='drive.google.com'){

    platform='Google Drive';

    const match=u.pathname.match(/\/file\/d\/([\w-]+)/);

    const driveId=match?match[1]:u.searchParams.get('id');

    if(driveId&&/^[\w-]+$/.test(driveId)){

      embed='https://drive.google.com/file/d/'+
        driveId+'/preview';

    }

  }

  if([
    'vimeo.com',
    'www.vimeo.com',
    'player.vimeo.com'
  ].includes(host)){

    platform='Vimeo';

    const match=u.pathname.match(/\/(\d+)(?:\/|$)/);

    if(match){

      embed='https://player.vimeo.com/video/'+match[1];

    }

  }

  if(/\.(mp4|webm|ogg)$/i.test(u.pathname)){

    return `

      <video
        class="video-frame"
        src="${esc(link)}"
        controls
        playsinline
        preload="metadata"
      ></video>

      <a class="btn btn-secondary"
        href="${esc(link)}"
        target="_blank"
        rel="noopener noreferrer">
        Ouvrir la vidéo
      </a>

    `;

  }

  if(
    host==='instagram.com'||
    host.endsWith('.instagram.com')
  ){

    platform='Instagram';

  }

  if(
    host==='tiktok.com'||
    host.endsWith('.tiktok.com')
  ){

    platform='TikTok';

  }

  if(
    host==='facebook.com'||
    host.endsWith('.facebook.com')
  ){

    platform='Facebook';

  }

  return `

    ${embed?`

      <iframe
        class="video-frame"
        src="${esc(embed)}"
        title="Tutoriel sportif"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="encrypted-media;fullscreen;picture-in-picture"
        allowfullscreen
      ></iframe>

    `:`

      <div class="video-preview">

        <div style="font-size:40px;color:#72bbff">▶</div>

        <h3>Tutoriel ${esc(platform)}</h3>

        <p class="muted small">
          Consultez la vidéo sur sa plateforme d'origine.
        </p>

      </div>

    `}

    <a class="btn"
      href="${esc(link)}"
      target="_blank"
      rel="noopener noreferrer">

      ▶ Ouvrir ${esc(platform)}

    </a>

  `;

}

function videoPlatform(value){

  const link=safeUrl(value);

  if(!link)return '';

  const host=new URL(link).hostname.toLowerCase();

  if(host==='youtu.be'||host==='youtube.com'||
    host.endsWith('.youtube.com'))return 'YouTube';

  if(host==='drive.google.com')return 'Google Drive';

  if(host==='instagram.com'||
    host.endsWith('.instagram.com'))return 'Instagram';

  if(host==='tiktok.com'||
    host.endsWith('.tiktok.com'))return 'TikTok';

  if(host==='facebook.com'||
    host.endsWith('.facebook.com'))return 'Facebook';

  if(host==='vimeo.com'||
    host.endsWith('.vimeo.com'))return 'Vimeo';

  return 'Lien vidéo';

}

/************************************************************
 * 12. COMPRESSION DE LA PHOTO DE PROFIL
 ************************************************************/

async function compressImage(file){

  if(!file)return '';

  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){

    throw new Error('Choisissez une photo JPG, PNG ou WEBP.');

  }

  if(file.size>15000000){

    throw new Error('Photo trop volumineuse.');

  }

  const url=URL.createObjectURL(file);

  try{

    const img=await new Promise((resolve,reject)=>{

      const i=new Image();

      i.onload=()=>resolve(i);

      i.onerror=()=>reject(new Error('Photo illisible.'));

      i.src=url;

    });

    const ratio=Math.min(
      1,
      CONFIG.PHOTO_DIMENSION/Math.max(img.width,img.height)
    );

    const canvas=document.createElement('canvas');

    canvas.width=Math.max(1,Math.round(img.width*ratio));

    canvas.height=Math.max(1,Math.round(img.height*ratio));

    const ctx=canvas.getContext('2d');

    if(!ctx)throw new Error('Compression indisponible.');

    ctx.fillStyle='#ffffff';

    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    let quality=.85;

    let result=canvas.toDataURL('image/jpeg',quality);

    while(
      result.length*.75>CONFIG.MAX_PHOTO_SIZE&&
      quality>.3
    ){

      quality-=.1;

      result=canvas.toDataURL('image/jpeg',quality);

    }

    if(result.length*.75>CONFIG.MAX_PHOTO_SIZE){

      throw new Error('Impossible de compresser la photo.');

    }

    return result;

  }finally{

    URL.revokeObjectURL(url);

  }

}

/************************************************************
 * 15. SERIES, REPETITIONS, CHARGES ET REPOS
 *
 * Compatible avec les nombres et le texte libre.
 ************************************************************/

function splitValues(value){

  if(Array.isArray(value))return value.map(String);

  return String(value??'')
    .split(/[\/;\n]/)
    .map(v=>v.trim());

}

function numericSeries(value){

  const text=String(value??'').trim();

  if(!/^\d+$/.test(text))return 0;

  const n=Number(text);

  return n>=1&&n<=100?n:0;

}

function seriesLabel(value){

  const text=String(value??'').trim();

  if(!text)return 'Séries non renseignées';

  return numericSeries(text)?text+' séries':text;

}

function seriesTable(session){

  const count=numericSeries(session.series);

  const reps=splitValues(session.reps);

  const charges=splitValues(session.charges);

  const rests=splitValues(session.repos);

  function at(values,index){

    return values.length===1

      ?values[0]||'—'

      :values[index]||'—';

  }

  function unit(value,suffix){

    return /^\d+(?:[.,]\d+)?$/.test(value)

      ?value+' '+suffix

      :value;

  }

  /*
   * Si le nombre de séries est un texte libre,
   * ou si les valeurs ne correspondent pas au nombre
   * de séries, affichage intégral sans perte de données.
   */

  const compatible=count&&
    [reps,charges,rests].every(
      values=>values.length===1||values.length===count
    );

  if(!compatible){

    return `

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Séries</th>
              <th>Répétitions</th>
              <th>Charges</th>
              <th>Repos</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>${esc(session.series||'—')}</td>
              <td>${esc(session.reps||'—')}</td>
              <td>${esc(unit(String(session.charges||'—'),'kg'))}</td>
              <td>${esc(unit(String(session.repos||'—'),'s'))}</td>
            </tr>
          </tbody>

        </table>

      </div>

    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Série</th>
            <th>Répétitions</th>
            <th>Charge</th>
            <th>Repos</th>
          </tr>

        </thead>

        <tbody>

          ${Array.from({length:count},(_,i)=>`

            <tr>

              <td style="color:#72bbff;font-weight:bold">
                ${i+1}
              </td>

              <td>${esc(at(reps,i))}</td>

              <td>${esc(unit(at(charges,i),'kg'))}</td>

              <td>${esc(unit(at(rests,i),'s'))}</td>

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>

  `;

}

/************************************************************
 * ENREGISTREMENT DANS LA FEUILLE REPONSES
 ************************************************************/

async function submitFeedback(event){

  event.preventDefault();

  if(feedbackPending||requestPending)return;

  const form=event.currentTarget;

  const id=String(form.dataset.feedbackId||'');

  const session=state.sessions.find(
    s=>String(s.idExercice)===id
  );

  if(!session||!id){

    setFeedbackMessage(
      form,
      'Identifiant exercice introuvable. Actualisez vos séances.',
      'error'
    );

    return;

  }

  const values=collectFeedback(form);

  const resultat=normalizeResult(values.resultat);

  const commentaire=values.commentaire.trim();

  const videoSportif=values.videoSportif.trim();

  if(!['REUSSI','NON REUSSI'].includes(resultat)){

    setFeedbackMessage(
      form,
      'Sélectionnez Réussi ou Non réussi.',
      'error'
    );

    return;

  }

  if(commentaire.length>CONFIG.MAX_COMMENT){

    setFeedbackMessage(form,'Commentaire trop long.','error');

    return;

  }

  if(videoSportif&&(
    !safeUrl(videoSportif)||
    videoSportif.length>CONFIG.MAX_VIDEO_URL
  )){

    setFeedbackMessage(
      form,
      'Saisissez un lien vidéo valide commençant par https://.',
      'error'
    );

    return;

  }

  const btn=form.querySelector('.feedback-submit');

  const originalText=btn.textContent;

  const submitted={

    resultat,

    commentaire,

    videoSportif

  };

  feedbackDrafts.set(id,submitted);

  setFeedbackBusy(true);

  btn.textContent='Enregistrement en cours…';

  setFeedbackMessage(
    form,
    'Transmission de votre appréciation au coach…',
    'muted'
  );

  try{

    /*
     * L'identifiant de l'exercice permet au serveur
     * de retrouver la séance et le sportif associé au token.
     *
     * Aucun identifiant sportif modifiable n'est utilisé
     * comme autorisation côté navigateur.
     */

    const payload={

      idExercice:session.idExercice,

      idSeance:session.idSeance,

      resultat,

      commentaire,

      videoSportif

    };

    const response=await callAPI(
      CONFIG.RESPONSE_ACTION,
      payload
    );

    /*
     * Recherche de la réponse réellement enregistrée.
     */

    let confirmed=response.sessions.find(
      s=>String(s.idExercice)===id
    );

    const saved=response.savedResponse;

    if(saved&&saved.ok===false){

      throw new Error(
        saved.message||'Enregistrement refusé.'
      );

    }

    if(!confirmed&&saved){

      const savedId=String(first(saved,[
        'idExercice','ID_EXERCICE','ID EXERCICE','exerciseId'
      ]));

      if(savedId===id){

        confirmed={

          ...session,

          ...normalizeFeedback({

            ...saved,

            videoSportif:first(saved,[
              'videoSportif','video','VIDEO SPORTIF'
            ]),

            dateReponse:first(saved,[
              'dateReponse','date','DATE'
            ])

          })

        };

      }

    }

    /*
     * Si le serveur ne renvoie pas directement la réponse,
     * lecture de contrôle pour vérifier l'enregistrement.
     */

    if(!confirmed||!sameFeedback(confirmed,submitted)){

      const verification=await callAPI('read');

      if(verification.status!=='ACTIF'){

        throw new Error(
          'Votre carte ne permet plus cet enregistrement.'
        );

      }

      confirmed=verification.sessions.find(
        s=>String(s.idExercice)===id
      );

    }

    if(!confirmed||!sameFeedback(confirmed,submitted)){

      throw new Error(
        'Le serveur n’a pas confirmé toutes les données. '+
        'Vérifiez la feuille REPONSES avant de réessayer.'
      );

    }

    /*
     * Mise à jour locale uniquement après confirmation.
     * Pas de rechargement complet de la page.
     */

    Object.assign(session,{

      resultat:confirmed.resultat,

      commentaire:confirmed.commentaire,

      videoSportif:confirmed.videoSportif,

      dateReponse:confirmed.dateReponse

    });

    feedbackDrafts.delete(id);

    updateExerciseFeedback(form,session);

    updateAllProgress();

    setFeedbackMessage(
      form,
      '✓ Votre appréciation a bien été enregistrée.',
      'success'
    );

    btn.textContent='Mettre à jour mon appréciation';

  }catch(error){

    setFeedbackMessage(
      form,
      error.message||'Impossible d’enregistrer votre réponse.',
      'error'
    );

    btn.textContent=originalText;

  }finally{

    setFeedbackBusy(false);

  }

}

/************************************************************
 * 17. PROGRESSION DES SEANCES
 ************************************************************/

function getProgress(items){

  const total=items.length;

  const success=items.filter(
    s=>s.resultat==='REUSSI'
  ).length;

  const failed=items.filter(
    s=>s.resultat==='NON REUSSI'
  ).length;

  const completed=success+failed;

  const pending=total-completed;

  const percent=total

    ?Math.round(completed/total*100)

    :0;

  return {

    total,

    success,

    failed,

    completed,

    pending,

    percent

  };

}

function progressHTML(items){

  const p=getProgress(items);

  return `

    <div class="progress-info">

      <span>Suivi de la séance</span>

      <strong class="progress-count">
        ${p.completed}/${p.total} renseignés
      </strong>

    </div>

    <div class="progress-track"
      role="progressbar"
      aria-label="Exercices renseignés"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="${p.percent}">

      <div class="progress-fill"
        style="width:${p.percent}%"></div>

    </div>

    <div class="session-stats">

      <span class="session-stat success">
        ✓ <span class="count-success">${p.success}</span> réussi(s)
      </span>

      <span class="session-stat error">
        ✕ <span class="count-failed">${p.failed}</span> non réussi(s)
      </span>

      <span class="session-stat muted">
        <span class="count-pending">${p.pending}</span> à renseigner
      </span>

    </div>

  `;

}

function updateAllProgress(){

  app.querySelectorAll('.session-card').forEach(card=>{

    const key=card.dataset.sessionKey;

    const items=state.sessions.filter(
      s=>sessionKey(s)===key
    );

    const p=getProgress(items);

    const count=card.querySelector('.progress-count');

    const fill=card.querySelector('.progress-fill');

    const track=card.querySelector('.progress-track');

    const success=card.querySelector('.count-success');

    const failed=card.querySelector('.count-failed');

    const pending=card.querySelector('.count-pending');

    if(count){

      count.textContent=
        p.completed+'/'+p.total+' renseignés';

    }

    if(fill)fill.style.width=p.percent+'%';

    if(track)track.setAttribute('aria-valuenow',p.percent);

    if(success)success.textContent=p.success;

    if(failed)failed.textContent=p.failed;

    if(pending)pending.textContent=p.pending;

  });

}


/************************************************************
 * 18. SEANCES PERSONNALISEES
 ************************************************************/

function showSessions(){

  const content=document.getElementById('memberContent');

  if(!content)return;

  const grouped=new Map();

  (state.sessions||[]).forEach(s=>{

    const key=sessionKey(s);

    if(!grouped.has(key)){

      grouped.set(key,{

        name:s.nom,

        items:[]

      });

    }

    grouped.get(key).items.push(s);

  });

  let formIndex=0;

  content.innerHTML=`

    <div class="section-heading">

      <div>

        <div class="eyebrow">VOTRE PROGRAMMATION</div>

        <h2>Mes séances</h2>

        <p class="small muted">
          ${grouped.size} programme(s) personnalisé(s)
        </p>

      </div>

      <button class="btn btn-secondary" id="refreshBtn">
        ↻ Actualiser
      </button>

    </div>

    ${!grouped.size?`

      <div class="empty">

        <h3>Aucune séance attribuée</h3>

        <p>
          Votre coach pourra vous transmettre
          votre programme personnalisé.
        </p>

        <button class="btn" id="libraryBtn">
          Découvrir les exercices
        </button>

      </div>

    `:''}

    ${[...grouped].map(([key,group],sessionIndex)=>{

      const items=group.items;

      const allNumeric=items.every(
        s=>numericSeries(s.series)>0
      );

      const totalSeries=items.reduce(
        (sum,s)=>sum+numericSeries(s.series),0
      );

      return `

        <article class="session-card"
          data-session-key="${esc(key)}">

          <div class="session-header">

            <div class="eyebrow">

              PROGRAMME
              ${String(sessionIndex+1).padStart(2,'0')}

            </div>

            <h3 style="font-size:27px;margin-top:10px">
              ${esc(group.name)}
            </h3>

            <span class="small muted">

              ${items.length} exercice(s)

              ${allNumeric?' · '+totalSeries+' séries':''}

            </span>

            ${progressHTML(items)}

          </div>

          <div class="session-content">

            ${items.map((s,i)=>{

              const uniqueIndex=formIndex++;

              const index=exercises.findIndex(
                e=>normalize(e.nom)===normalize(s.exercice)
              );

              const ref=exercises[index]||{};

              /*
               * Les données spécifiques de la séance
               * sont prioritaires sur la bibliothèque.
               */

              const photo=s.photo||ref.photo;

              const video=s.video||ref.video;

              const groupes=s.groupes||ref.groupes;

              const description=s.description||ref.description;

              const statusClass=

                s.resultat==='REUSSI'

                  ?'is-success'

                  :s.resultat==='NON REUSSI'

                    ?'is-failed'

                    :'';

              return `

                <details class="session-exercise ${statusClass}">

                  <summary>

                    <div class="exercise-number">
                      ${String(i+1).padStart(2,'0')}
                    </div>

                    <div class="summary-info">

                      <strong>${esc(s.exercice)}</strong>

                      <small>

                        ${esc(seriesLabel(s.series))}

                        ${groupes?' · '+esc(groupes):''}

                      </small>

                    </div>

                    <span class="feedback-status ${resultClass(s.resultat)}">

                      ${resultLabel(s.resultat)}

                    </span>

                    <span class="summary-arrow">⌄</span>

                  </summary>

                  <div class="details-body">

                    ${s.personnalise?`

                      <span class="custom-tag">
                        EXERCICE PERSONNALISÉ
                      </span>

                    `:''}

                    ${muscleTags(groupes)}

                    ${index>=0

                      ?clickablePhoto({
                        ...ref,
                        photo,
                        video
                      },index)

                      :photo
                        ?exerciseImage(photo,s.exercice)
                        :''

                    }

                    ${description?`

                      <p class="muted"
                        style="margin-top:15px;white-space:pre-wrap">

                        ${esc(description)}

                      </p>

                    `:''}

                    <div class="eyebrow" style="margin-top:18px">
                      VOTRE PROGRAMMATION
                    </div>

                    ${seriesTable(s)}

                    ${s.notes?`

                      <div class="coach-message">

                        <div class="eyebrow">
                          CONSIGNES DU COACH
                        </div>

                        ${esc(s.notes)}

                      </div>

                    `:''}

                    ${video?`

                      <div class="eyebrow" style="margin-top:20px">
                        TUTORIEL VIDÉO DU COACH
                      </div>

                      <div class="session-video"
                        data-video="${esc(video)}"></div>

                    `:''}

                    ${feedbackHTML(s,uniqueIndex)}

                  </div>

                </details>

              `;

            }).join('')}

          </div>

        </article>

      `;

    }).join('')}

  `;

  document.getElementById('refreshBtn').onclick=refreshData;

  const libraryBtn=document.getElementById('libraryBtn');

  if(libraryBtn){

    libraryBtn.onclick=()=>changeTab('exercises');

  }

  /*
   * Les vidéos du coach sont chargées uniquement
   * lorsque le sportif ouvre l'exercice.
   */

  content.querySelectorAll('.session-exercise')
    .forEach(details=>{

      details.addEventListener('toggle',()=>{

        const container=details.querySelector('.session-video');

        if(container){

          container.innerHTML=details.open

            ?videoHTML(container.dataset.video)

            :'';

        }

      });

    });

  /*
   * Conservation des brouillons pendant la navigation.
   * Enregistrement uniquement lors de la validation.
   */

  content.querySelectorAll('.feedback-form')
    .forEach(form=>{

      form.addEventListener('input',()=>saveDraft(form));

      form.addEventListener('change',()=>saveDraft(form));

      form.addEventListener('submit',submitFeedback);

    });

}

/************************************************************
 * 20. ACTUALISATION ET ETAT DES CARTES
 ************************************************************/

async function refreshData(){

  if(requestPending||feedbackPending)return;

  requestPending=true;

  closeModal();

  loading('Actualisation de votre espace sportif…');

  try{

    state=await callAPI('read');

    /*
     * Suppression des brouillons concernant
     * les exercices qui ne sont plus attribués.
     */

    const validIds=new Set(
      state.sessions.map(s=>feedbackKey(s))
    );

    for(const key of feedbackDrafts.keys()){

      if(!validIds.has(key)){

        feedbackDrafts.delete(key);

      }

    }

    routeState();

  }catch(error){

    showError(error.message);

  }finally{

    requestPending=false;

  }

}

function routeState(){

  if(state.status==='DISPONIBLE'){

    feedbackDrafts.clear();

    showActivation();

  }else if(state.status==='ACTIF'){

    showDashboard();

  }else if(state.status==='DESACTIVE'){

    feedbackDrafts.clear();

    showError(
      'Cette carte a été désactivée. Contactez votre coach.'
    );

  }else{

    showError('Carte introuvable ou statut non reconnu.');

  }

}


/************************************************************
 * 21. PROTECTION DES COMMENTAIRES NON ENREGISTRES
 ************************************************************/

window.addEventListener('beforeunload',event=>{

  if(feedbackPending||feedbackDrafts.size>0){

    event.preventDefault();

    event.returnValue='';

  }

});


/************************************************************
 * 22. LANCEMENT DU SITE
 *
 * Sans token : accueil public.
 * Avec token : espace NFC personnel.
 ************************************************************/

async function init(){

  if(requestPending||feedbackPending)return;

  if(!token){

    showPublicHome();

    return;

  }

  requestPending=true;

  loading('Connexion à votre espace EAH SPORT…');

  try{

    state=await callAPI('read');

    routeState();

  }catch(error){

    showError(error.message);

  }finally{

    requestPending=false;

  }

}

init();

</script>
