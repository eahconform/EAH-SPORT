
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<meta name="referrer" content="no-referrer">

<title>EAH SPORT | Personal Coaching</title>

<style>
:root {
  --bg:#071321;
  --panel:#102238;
  --panel2:#152d47;
  --blue:#087cf0;
  --light:#72bbff;
  --white:#ffffff;
  --muted:#9eb4cc;
  --border:#29435f;
  --green:#39d99a;
  --orange:#ffb75e;
  --red:#ff8585;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

button,input,select {
  font:inherit;
}

button,a {

}

button {
  cursor:pointer;
}

button:disabled {
  opacity:.5;
  cursor:wait;
}

h1,h2,h3,p {
  margin-top:0;
}

h1 {
  font-size:clamp(30px,5vw,48px);
  line-height:1.15;
  margin-bottom:15px;
}

h2 {
  font-size:25px;
  margin-bottom:10px;
}

h3 {
  font-size:20px;
  margin-bottom:8px;
}

a {
  color:var(--light);
}

header {
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(7,19,33,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
}

.header-inner {
  max-width:1250px;
  margin:auto;
  padding:15px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand {

}

.brand img {

  object-fit:contain;
}

.brand-title {

  letter-spacing:3px;

}

.brand-title span {

}

.brand-subtitle {

}

.status {

  color:var(--green);
}

main {

}

.hero {

  overflow:hidden;

}

.hero::after {

}

.eyebrow {
  font-size:11px;
  font-weight:800;
  letter-spacing:2px;
  color:var(--light);
  text-transform:uppercase;
}

.muted {

}

.small {
  font-size:12px;
}

.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;

  margin-bottom:20px;
}

.btn {

  justify-content:center;

  border:0;

}

.btn:hover {

}

.btn-secondary {

  border:1px solid #31516f;
}

.full {

}

.grid {

}

.profile-head {

.avatar {

.avatar-placeholder {

.profile-head h1 {

.coach-message {

.stats {

.stat {

.stat span {

.section-heading {

.photo-label {

.photo-placeholder {

.photo-placeholder svg {

.exercise-description {

input,select {

.form-card {

.activation-heading {

.activation-heading img {

.consent {

.consent input {

.session-card {

  border:1px solid var(--border);
  border-radius:20px;

  margin-bottom:24px;
}

.session-header {

      #102238
    );

.session-meta {

}

.session-content {

}

.session-exercise {

.session-exercise:last-child {

}

.session-exercise summary {

.session-exercise summary::-webkit-details-marker {

.exercise-number {

}

.summary-info {

}

.summary-info strong {

.summary-info small {

.chevron {

details[open] .chevron {

.details-body {

.table-wrap {

table {

th {

td,th {

}

td {

tr:nth-child(even) td {

}

.set-number {

}

.video-frame {

  background:black;
  border-radius:12px;

.video-preview {

.video-link {

.profile-line {

.profile-line strong {

.empty {

.spinner {

.modal {

  background:rgba(0,0,0,.84);

.modal.open {

.modal-inner {

.modal-top {

.modal-top h2 {

.close {

.modal-description {

<script>

/************************************************************
 * 1. CONFIGURATION
 * Ton lien Apps Script est déjà intégré.
 ************************************************************/

const API =
  'https://script.google.com/macros/s/AKfycbzRqNkdk5gvHbIPtdRAGwxMfmMGX3yoCv4FnPUGPJA5qYVZAyUHUV8ODEiBIBD9AhQD/exec';

const CONFIG = {

  NAME:'EAH SPORT',

  SHEET_ID:
    '1psuHRrKQaFlleYeG8CdhUot6szMS5G9-76bpDIbYlKo',

  PHOTO_DIMENSION:600,

  MAX_PHOTO_SIZE:700000

};


/************************************************************
 * 2. VARIABLES
 ************************************************************/

const app =
  document.getElementById('app');

const modal =
  document.getElementById('modal');

const modalContent =
  document.getElementById('modalContent');

const connection =
  document.getElementById('connection');

const params =
  new URLSearchParams(window.location.search);

const token =
  params.get('token') ||
  params.get('t') ||
  '';

let state = null;

let currentTab = 'sessions';

let compressedPhoto = '';

let photoTask = Promise.resolve('');

let requestPending = false;

let previousFocus = null;


/************************************************************
 * 3. SECURITE ET NORMALISATION
 ************************************************************/

function esc(value) {

  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

function normalize(value) {

  return String(value ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();

}

function safeUrl(value) {

  try {

    const u = new URL(
      String(value || '')
    );

    return u.protocol === 'https:'
      ? u.href
      : '';

  } catch {

    return '';

  }

}

function isActive(value) {

  return [
    'true',
    '1',
    'oui',
    'actif',
    'active',
    'activee'
  ].includes(normalize(value));

}

function first(object,keys,fallback = '') {

  for (const key of keys) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null &&
      object[key] !== ''
    ) {

      return object[key];

    }

  }

  return fallback;

}

function safeAvatar(value) {

  const v = String(value || '');

  if (
    /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/
      .test(v)
  ) {

    return v;

  }

  return safeUrl(v);

}

function imageUrl(value) {

  const url = safeUrl(value);

  if (url) {

    const u = new URL(url);

    if (u.hostname === 'drive.google.com') {

      const match = u.pathname.match(
        /\/file\/d\/([\w-]+)/
      );

      const id = match
        ? match[1]
        : u.searchParams.get('id');

      if (id && /^[\w-]+$/.test(id)) {

        return (
          'https://drive.google.com/thumbnail?id=' +
          encodeURIComponent(id) +
          '&sz=w1200'
        );

      }

    }

    return url;

  }

  const relative = String(value || '');

  if (
    /^images\/[a-zA-Z0-9_.-]+\.(webp|jpg|jpeg|png)$/i
      .test(relative)
  ) {

    return new URL(
      relative,
      window.location.href
    ).href;

  }

  return '';

}


/************************************************************
 * 4. ADAPTATION DES DONNEES APPS SCRIPT
 ************************************************************/

function normalizeProfile(p) {

  return {

    id:first(p,['id','ID','identifiant','IDENTIFIANT']),

    nom:first(p,['nom','NOM','lastName']),

    prenom:first(
      p,['prenom','PRENOM','firstName']
    ),

    poids:first(p,['poids','POIDS','weight']),

    age:first(p,['age','AGE']),

    taille:first(p,['taille','TAILLE','height']),

    coach:first(p,['coach','COACH']),

    email:first(p,['email','EMAIL','mail','MAIL']),

    photo:first(
      p,['photo','PHOTO','photoUrl','PHOTO_URL']
    ),

    message:first(
      p,
      [
        'message',
        'MESSAGE',
        'messageCoach',
        'MESSAGE_COACH'
      ]
    )

  };

}

function normalizeExercise(e) {

  return {

    nom:first(
      e,
      [
        'nom',
        'NOM',
        'exercice',
        'EXERCICE',
        'name'
      ]
    ),

    groupes:first(
      e,
      [
        'groupes',
        'GROUPES',
        'muscles',
        'GROUPES_MUSCULAIRES'
      ]
    ),

    description:first(
      e,
      ['description','DESCRIPTION']
    ),

    photo:first(
      e,
      [
        'photo',
        'PHOTO',
        'image',
        'photoUrl',
        'URL_PHOTO',
        'IMAGE'
      ]
    ),

    video:first(
      e,
      [
        'video',
        'VIDEO',
        'videoUrl',
        'URL_VIDEO'
      ]
    )

  };

}

function normalizeSession(s) {

  return {

    nom:first(
      s,
      [
        'nom',
        'seance',
        'SEANCE',
        'session',
        'NOM_SEANCE'
      ]
    ),

    exercice:first(
      s,
      ['exercice','EXERCICE','exercise']
    ),

    groupes:first(
      s,
      ['groupes','GROUPES','muscles']
    ),

    video:first(
      s,
      ['video','VIDEO','videoUrl']
    ),

    photo:first(
      s,
      ['photo','PHOTO','image']
    ),

    description:first(
      s,
      ['description','DESCRIPTION']
    ),

    series:first(
      s,
      ['series','SERIES','sets']
    ),

    reps:first(
      s,
      [
        'reps',
        'REPS',
        'repetitions',
        'REPETITIONS'
      ]
    ),

    charges:first(
      s,
      [
        'charges',
        'CHARGES',
        'charge',
        'poids',
        'POIDS',
        'CHARGE'
      ]
    ),

    repos:first(
      s,
      [
        'repos',
        'REPOS',
        'recuperation',
        'RECUPERATION',
        'rest'
      ]
    ),

    notes:first(
      s,
      ['notes','NOTES','consignes','CONSIGNES']
    )

  };

}

function normalizeResponse(result) {

  const payload =
    result.data &&
    typeof result.data === 'object' &&
    !Array.isArray(result.data)

    ? {...result,...result.data}

    : result;

  const profile =
    payload.profil ||
    payload.profile ||
    payload.user ||
    payload.utilisateur ||
    null;

  const statusValue = normalize(

    first(
      payload,
      ['status','statut','STATUS','STATUT'],

      profile
        ? first(
            profile,
            ['status','statut','STATUS','STATUT']
          )
        : ''
    )

  );

  let status = statusValue.toUpperCase();

  if (
    [
      'active',
      'actif',
      'activee',
      'activated'
    ].includes(statusValue)
  ) {

    status = 'ACTIF';

  }

  if (
    [
      'disponible',
      'available',
      'libre',
      'inactive',
      'non active'
    ].includes(statusValue)
  ) {

    status = 'DISPONIBLE';

  }

  if (
    [
      'desactive',
      'desactivee',
      'disabled',
      'bloque'
    ].includes(statusValue)
  ) {

    status = 'DESACTIVE';

  }

  const exerciseList =
    payload.exercises ||
    payload.exercices ||
    [];

  const sessionList =
    payload.sessions ||
    payload.seances ||
    [];

  return {

    ...payload,

    status,

    id:first(
      payload,
      ['id','ID','identifiant']
    ),

    coach:first(payload,['coach','COACH']),

    profil:profile
      ? normalizeProfile(profile)
      : null,

    exercises:Array.isArray(exerciseList)

      ? exerciseList
          .filter(e => {

            const active = first(
              e,
              ['active','ACTIVE','actif','ACTIF'],
              null
            );

            return active === null ||
              isActive(active);

          })
          .map(normalizeExercise)
          .filter(e => e.nom)

      : [],

    sessions:Array.isArray(sessionList)

      ? sessionList
          .filter(s => {

            const active = first(
              s,
              ['active','ACTIVE','actif','ACTIF'],
              null
            );

            return active === null ||
              isActive(active);

          })
          .map(normalizeSession)
          .filter(s => s.nom && s.exercice)

      : []

  };

}


/************************************************************
 * 5. COMMUNICATION AVEC TON APPS SCRIPT
 ************************************************************/

async function callAPI(action,data = {}) {

  if (!token) {

    throw new Error(
      'Aucune carte NFC détectée.'
    );

  }

  if (!/^[A-Za-z0-9_-]{20,160}$/.test(token)) {

    throw new Error(
      'Le lien de votre carte est invalide.'
    );

  }

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    45000
  );

  try {

    const response = await fetch(API,{

      method:'POST',

      headers:{
        'Content-Type':'text/plain;charset=UTF-8'
      },

      body:JSON.stringify({
        action:action,
        token:token,
        data:data
      }),

      redirect:'follow',

      credentials:'omit',

      cache:'no-store',

      signal:controller.signal

    });

    if (!response.ok) {

      throw new Error(
        'Erreur serveur : ' + response.status
      );

    }

    const raw = await response.text();

    let result;

    try {

      result = JSON.parse(raw);

    } catch {

      throw new Error(
        'Réponse Apps Script invalide. ' +
        'Vérifiez le déploiement de votre application Web.'
      );

    }

    if (!result || result.ok === false ||
        result.success === false) {

      throw new Error(

        result?.error ||
        result?.message ||
        'Accès impossible.'

      );

    }

    return normalizeResponse(result);

  } catch(error) {

    if (error.name === 'AbortError') {

      throw new Error(
        'Le serveur met trop de temps à répondre.'
      );

    }

    if (error instanceof TypeError) {

      throw new Error(
        'Connexion impossible au serveur EAH SPORT. ' +
        'Vérifiez la connexion et les autorisations Apps Script.'
      );

    }

    throw error;

  } finally {

    clearTimeout(timer);

  }

}

/************************************************************
 * 8. COMPRESSION PHOTO
 ************************************************************/

async function compressImage(file) {

  if (!file) return '';

  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {

    throw new Error(
      'Choisissez une photo JPG, PNG ou WEBP.'
    );

  }

  if (file.size > 15000000) {

    throw new Error(
      'La photo est trop volumineuse.'
    );

  }

  const url = URL.createObjectURL(file);

  try {

    const img = await new Promise(
      (resolve,reject) => {

        const i = new Image();

        i.onload = () => resolve(i);

        i.onerror = () =>
          reject(new Error('Photo illisible.'));

        i.src = url;

      }
    );

    const ratio = Math.min(
      1,
      CONFIG.PHOTO_DIMENSION /
        Math.max(img.width,img.height)
    );

    const canvas =
      document.createElement('canvas');

    canvas.width =
      Math.max(1,Math.round(img.width * ratio));

    canvas.height =
      Math.max(1,Math.round(img.height * ratio));

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';

    ctx.fillRect(
      0,0,canvas.width,canvas.height
    );

    ctx.drawImage(
      img,0,0,canvas.width,canvas.height
    );

    let quality = .85;

    let result = canvas.toDataURL(
      'image/jpeg',quality
    );

    while (
      result.length * .75 >
        CONFIG.MAX_PHOTO_SIZE &&
      quality > .3
    ) {

      quality -= .1;

      result = canvas.toDataURL(
        'image/jpeg',quality
      );

    }

    if (
      result.length * .75 >
        CONFIG.MAX_PHOTO_SIZE
    ) {

      throw new Error(
        'Impossible de compresser cette photo.'
      );

    }

    return result;

  } finally {

    URL.revokeObjectURL(url);

  }

}

/************************************************************
 * 12. LECTEUR VIDEO
 *
 * YouTube
 * YouTube Shorts
 * Google Drive
 * Vimeo
 * MP4 / WEBM
 * Instagram et autres liens
 ************************************************************/

function videoHTML(value) {

  const link = safeUrl(value);

  if (!link) {

    return `

      <div class="empty">

        <h3>Tutoriel bientôt disponible</h3>

        <p>
          Votre coach pourra ajouter une vidéo.
        </p>

      </div>

    `;

  }

  const u = new URL(link);

  const host =
    u.hostname.toLowerCase();

  let embed = '';

  let id = '';

  let platform = 'la vidéo';


  // YOUTUBE

  if (host === 'youtu.be') {

    id = u.pathname.split('/')[1] || '';

  }

  if ([
    'youtube.com',
    'www.youtube.com',
    'm.youtube.com',
    'www.youtube-nocookie.com'
  ].includes(host)) {

    id = u.searchParams.get('v') || '';

    if (!id) {

      const match = u.pathname.match(
        /^\/(?:shorts|embed|live)\/([\w-]+)/
      );

      if (match) id = match[1];

    }

  }

  if (/^[A-Za-z0-9_-]{11}$/.test(id)) {

    platform = 'YouTube';

    embed =
      'https://www.youtube-nocookie.com/embed/' +
      id;

  }


  // GOOGLE DRIVE

  if (host === 'drive.google.com') {

    platform = 'Google Drive';

    const match = u.pathname.match(
      /\/file\/d\/([\w-]+)/
    );

    const driveId = match

      ? match[1]

      : u.searchParams.get('id');

    if (
      driveId &&
      /^[\w-]+$/.test(driveId)
    ) {

      embed =
        'https://drive.google.com/file/d/' +
        driveId +
        '/preview';

    }

  }


  // VIMEO

  if ([
    'vimeo.com',
    'www.vimeo.com',
    'player.vimeo.com'
  ].includes(host)) {

    platform = 'Vimeo';

    const match = u.pathname.match(
      /\/(\d+)(?:\/|$)/
    );

    if (match) {

      embed =
        'https://player.vimeo.com/video/' +
        match[1];

    }

  }


  // FICHIERS MP4 / WEBM

  if (/\.(mp4|webm|ogg)$/i.test(u.pathname)) {

    return `

      <video
        class="video-frame"
        controls
        playsinline
        preload="metadata"
        src="${esc(link)}"
      ></video>

      <a
        class="btn btn-secondary"
        href="${esc(link)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        Ouvrir la vidéo
      </a>

    `;

  }


  // INSTAGRAM

  if (
    host === 'instagram.com' ||
    host.endsWith('.instagram.com')
  ) {

    platform = 'Instagram';

  }


  // TIKTOK

  if (
    host === 'tiktok.com' ||
    host.endsWith('.tiktok.com')
  ) {

    platform = 'TikTok';

  }


  // FACEBOOK

  if (
    host === 'facebook.com' ||
    host.endsWith('.facebook.com')
  ) {

    platform = 'Facebook';

  }


  // AFFICHAGE FINAL

  return `

    ${embed ? `

      <iframe
        class="video-frame"
        src="${esc(embed)}"
        title="Tutoriel sportif"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="encrypted-media;fullscreen;picture-in-picture"
        allowfullscreen
      ></iframe>

    ` : `

      <div class="video-preview">

        <div style="font-size:40px;color:#72bbff">
          ▶
        </div>

        <h3>
          Tutoriel ${esc(platform)}
        </h3>

        <p class="small muted">
          Consultez la vidéo directement
          sur sa plateforme d'origine.
        </p>

      </div>

    `}

    <a
      class="btn video-link"
      href="${esc(link)}"
      target="_blank"
      rel="noopener noreferrer"
    >
      ▶ Ouvrir ${esc(platform)}
    </a>

  `;

}

/************************************************************
 * 14. NAVIGATION
 ************************************************************/

function renderTab() {

  app.querySelectorAll('[data-tab]')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.tab === currentTab
      );

    });

  if (currentTab === 'sessions') {

    showSessions();

  } else if (currentTab === 'exercises') {

    showExercises();

  } else {

    showProfile();

  }

}


/************************************************************
 * 15. TABLEAU SERIES ET REPETITIONS
 *
 * Exemple Google Sheets :
 *
 * SERIES : 4
 * REPETITIONS : 12/10/8/6
 * CHARGES : 40/50/60/70
 * REPOS : 90
 ************************************************************/

function splitValues(value) {

  if (Array.isArray(value)) {

    return value.map(v => String(v));

  }

  return String(value ?? '')
    .split(/[\/;\n]/)
    .map(v => v.trim());

}

function seriesTable(session) {

  const count = Math.min(

    100,

    Math.max(

      0,

      Math.floor(
        Number(session.series) || 0
      )

    )

  );

  const reps = splitValues(session.reps);

  const charges = splitValues(session.charges);

  const rests = splitValues(session.repos);

  function valueAt(values,index) {

    if (values.length === 1) {

      return values[0] || '—';

    }

    return values[index] || '—';

  }

  function formatLoad(value) {

    return /^\d+(?:[.,]\d+)?$/.test(value)

      ? value + ' kg'

      : value;

  }

  function formatRest(value) {

    return /^\d+(?:[.,]\d+)?$/.test(value)

      ? value + ' s'

      : value;

  }

  if (!count) {

    return `
      <p class="muted small">
        Séries non renseignées.
      </p>
    `;

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Série</th>

            <th>Répétitions</th>

            <th>Charge</th>

            <th>Repos</th>

          </tr>

        </thead>

        <tbody>

          ${Array.from(
            {length:count},
            (_,i) => `

              <tr>

                <td class="set-number">
                  ${i + 1}
                </td>

                <td>
                  ${esc(valueAt(reps,i))}
                </td>

                <td>
                  ${esc(formatLoad(
                    valueAt(charges,i)
                  ))}
                </td>

                <td>
                  ${esc(formatRest(
                    valueAt(rests,i)
                  ))}
                </td>

              </tr>

            `
          ).join('')}

        </tbody>

      </table>

    </div>

  `;

}


/************************************************************
 * 16. SEANCES INDIVIDUELLES
 ************************************************************/

function showSessions() {

  const content =
    document.getElementById('content');

  // Les séances doivent être filtrées par le serveur
  // avant leur envoi à ce profil.

  const sessions = state.sessions || [];

  const exercises = state.exercises || [];

  const grouped = new Map();

  sessions.forEach(s => {

    if (!grouped.has(s.nom)) {

      grouped.set(s.nom,[]);

    }

    grouped.get(s.nom).push(s);

  });

  content.innerHTML = `

    <div class="section-heading">

      <div>

        <h2>Mes séances</h2>

        <div class="muted small">

          ${grouped.size} programme(s)
          personnalisé(s)

        </div>

      </div>

      <button
        class="btn btn-secondary"
        id="refreshBtn"
      >
        ↻ Actualiser
      </button>

    </div>

    ${grouped.size === 0 ? `

      <div class="empty">

        <h3>Aucune séance attribuée</h3>

        <p>
          Votre coach pourra vous transmettre
          votre programme personnalisé.
        </p>

        <button
          class="btn"
          id="libraryBtn"
        >
          Découvrir les exercices
        </button>

      </div>

    ` : ''}

    ${[...grouped].map(
      ([name,items],sessionIndex) => {

        const sets = items.reduce(

          (sum,item) =>
            sum + (Number(item.series) || 0),

          0

        );

        return `

          <article class="session-card">

            <div class="session-header">

              <div class="eyebrow">

                PROGRAMME
                ${String(sessionIndex + 1)
                  .padStart(2,'0')}

              </div>

              <h3 style="font-size:25px;margin-top:10px">
                ${esc(name)}
              </h3>

              <div class="session-meta">

                <span>
                  ${items.length} exercice(s)
                </span>

                <span>
                  ${sets} série(s)
                </span>

                <span>
                  Programme personnalisé
                </span>

              </div>

            </div>

            <div class="session-content">

              ${items.map((s,i) => {

                const index = exercises.findIndex(

                  e =>
                    normalize(e.nom) ===
                    normalize(s.exercice)

                );

                const reference =
                  exercises[index] || {};

                const photo =
                  reference.photo || s.photo;

                const video =
                  reference.video || s.video;

                const groupes =
                  reference.groupes || s.groupes;

                const description =
                  reference.description ||
                  s.description;

                return `

                  <details class="session-exercise">

                    <summary>

                      <div class="exercise-number">

                        ${String(i + 1)
                          .padStart(2,'0')}

                      </div>

                      <div class="summary-info">

                        <strong>
                          ${esc(s.exercice)}
                        </strong>

                        <small>

                          ${esc(s.series)} séries

                          · ${esc(groupes)}

                        </small>

                      </div>

                      <span class="chevron">
                        ⌄
                      </span>

                    </summary>

                    <div class="details-body">

                      ${muscleTags(groupes)}

                      ${index >= 0

                        ? clickableExercisePhoto(
                            reference,index
                          )

                        : exerciseImage(
                            photo,s.exercice
                          )

                      }

                      <p
                        class="muted"
                        style="margin-top:15px"
                      >
                        ${esc(description)}
                      </p>

                      <div class="eyebrow">
                        VOTRE PROGRAMMATION
                      </div>

                      ${seriesTable(s)}

                      ${s.notes ? `

                        <div class="coach-message">

                          <div class="eyebrow">
                            CONSIGNES DU COACH
                          </div>

                          ${esc(s.notes)}

                        </div>

                      ` : ''}

                      <div
                        class="eyebrow"
                        style="margin-top:15px"
                      >
                        TUTORIEL VIDÉO
                      </div>

                      <div class="session-video"
                        data-video="${esc(video)}"
                      ></div>

                    </div>

                  </details>

                `;

              }).join('')}

            </div>

          </article>

        `;

      }
    ).join('')}

  `;

  document.getElementById('refreshBtn')
    .onclick = refreshData;

  const libraryBtn =
    document.getElementById('libraryBtn');

  if (libraryBtn) {

    libraryBtn.onclick = () => {

      currentTab = 'exercises';

      renderTab();

    };

  }

  content.querySelectorAll('.session-exercise')
    .forEach(details => {

      details.addEventListener('toggle',() => {

        const container =
          details.querySelector('.session-video');

        if (!container) return;

        if (details.open) {

          container.innerHTML =
            videoHTML(container.dataset.video);

        } else {

          container.innerHTML = '';

        }

      });

    });

}


/************************************************************
 * 17. BIBLIOTHEQUE EXERCICES
 ************************************************************/

function showExercises() {

  const content =
    document.getElementById('content');

  const exercises = state.exercises || [];

  const muscles = [...new Set(

    exercises.flatMap(
      e => splitMuscles(e.groupes)
    )

  )].sort((a,b) => a.localeCompare(b,'fr'));

  content.innerHTML = `

    <div class="section-heading">

      <div>

        <h2>Bibliothèque sportive</h2>

        <span class="muted small">

          ${exercises.length} exercice(s)
          disponible(s)

        </span>

      </div>

      <button
        class="btn btn-secondary"
        id="refreshLibrary"
      >
        ↻ Actualiser
      </button>

    </div>

    <p class="muted">

      Appuyez sur la photo d'un exercice pour
      découvrir ses consignes et son tutoriel vidéo.

    </p>

    <div class="search-bar">

      <input
        id="exerciseSearch"
        placeholder="Rechercher un exercice…"
        aria-label="Rechercher un exercice"
      >

      <select
        id="muscleFilter"
        aria-label="Filtrer par muscle"
      >

        <option value="">
          Tous les groupes musculaires
        </option>

        ${muscles.map(m => `

          <option value="${esc(m)}">
            ${esc(m)}
          </option>

        `).join('')}

      </select>

    </div>

    <div
      class="grid"
      id="exerciseList"
    ></div>

  `;

  const search =
    document.getElementById('exerciseSearch');

  const filter =
    document.getElementById('muscleFilter');

  function renderExercises() {

    const q = normalize(search.value);

    const selected = normalize(filter.value);

    const list = exercises

      .map((e,index) => ({...e,index}))

      .filter(e => {

        const searchText = normalize(

          e.nom + ' ' +

          e.groupes + ' ' +

          e.description

        );

        const groups = splitMuscles(
          e.groupes
        ).map(normalize);

        return searchText.includes(q) &&

          (!selected ||
            groups.includes(selected));

      });

    document.getElementById('exerciseList')
      .innerHTML = list.length ? (

        list.map(e => `

          <article class="exercise-card">

            ${clickableExercisePhoto(
              e,e.index
            )}

            <div class="exercise-body">

              <div class="eyebrow">
                EAH SPORT · EXERCICE
              </div>

              <h3 style="margin-top:10px">
                ${esc(e.nom)}
              </h3>

              ${muscleTags(e.groupes)}

              <p class="exercise-description">

                ${esc(
                  e.description ||
                  'Découvrez la fiche de cet exercice.'
                )}

              </p>

              <button
                class="btn full"
                data-open-exercise="${e.index}"
              >
                ▶ Voir les détails
              </button>

            </div>

          </article>

        `).join('')

      ) : `

        <div class="empty">

          <h3>Aucun exercice trouvé</h3>

          <p>
            Modifiez votre recherche ou votre filtre.
          </p>

        </div>

      `;

  }

  search.oninput = renderExercises;

  filter.onchange = renderExercises;

  document.getElementById('refreshLibrary')
    .onclick = refreshData;

  renderExercises();

}


/************************************************************
 * 18. OUVERTURE DETAIL EXERCICE
 *
 * Le clic sur la photo ou le bouton ouvre
 * automatiquement la fiche et la vidéo associée.
 ************************************************************/

function openExercise(index) {

  if (!state || !state.exercises) return;

  const e = state.exercises[index];

  if (!e) return;

  previousFocus = document.activeElement;

  modalContent.innerHTML = `

    <div class="modal-top">

      <div>

        <div class="eyebrow">
          FICHE TECHNIQUE EAH SPORT
        </div>

        <h2>${esc(e.nom)}</h2>

      </div>

      <button
        class="close"
        id="closeModal"
        aria-label="Fermer"
      >
        ×
      </button>

    </div>

    ${exerciseImage(e.photo,e.nom)}

    <section style="margin-top:20px">

      <div class="eyebrow">
        GROUPES MUSCULAIRES SOLLICITÉS
      </div>

      ${muscleTags(e.groupes)}

    </section>

    <section style="margin-top:20px">

      <div class="eyebrow">
        DESCRIPTION DE L'EXERCICE
      </div>

      <p
        class="modal-description"
        style="margin-top:10px"
      >
        ${esc(
          e.description ||
          'Votre coach ajoutera prochainement les consignes.'
        )}
      </p>

    </section>

    <section style="margin-top:25px">

      <div class="eyebrow">
        TUTORIEL VIDÉO
      </div>

      ${videoHTML(e.video)}

    </section>

    <button
      class="btn btn-secondary full"
      id="bottomClose"
      style="margin-top:20px"
    >
      Fermer la fiche
    </button>

  `;

  modal.classList.add('open');

  document.body.style.overflow = 'hidden';

  document.getElementById('closeModal')
    .onclick = closeModal;

  document.getElementById('bottomClose')
    .onclick = closeModal;

  document.getElementById('closeModal')
    .focus();

}

function closeModal() {

  modal.classList.remove('open');

  // Supprime le lecteur pour arrêter la vidéo.

  modalContent.innerHTML = '';

  document.body.style.overflow = '';

  if (
    previousFocus &&
    previousFocus.isConnected
  ) {

    previousFocus.focus();

  }

  previousFocus = null;

}


// Gestion du clic sur toutes les photos.

app.addEventListener('click',event => {

  const button = event.target.closest(
    '[data-open-exercise]'
  );

  if (button) {

    openExercise(
      Number(button.dataset.openExercise)
    );

  }

});


// Fermer en cliquant à l'extérieur.

modal.addEventListener('click',event => {

  if (event.target === modal) {

    closeModal();

  }

});


// Fermer avec la touche Echap.

document.addEventListener('keydown',event => {

  if (event.key === 'Escape' &&
      modal.classList.contains('open')) {

    closeModal();

  }

});


/************************************************************

  `;

    .onclick = refreshData;

/************************************************************
 * 20. ACTUALISATION DONNEES GOOGLE SHEETS
 ************************************************************/

async function refreshData() {

  if (requestPending) return;

  requestPending = true;

  closeModal();

  loading(
    'Actualisation de votre programme…'
  );

  try {

    state = await callAPI('read');

    routeState();

  } catch(error) {

    showError(error.message);

  } finally {

    requestPending = false;

  }

}


/************************************************************
 * 21. GESTION ETAT CARTE NFC
 ************************************************************/

function routeState() {

  if (state.status === 'DISPONIBLE') {

    showActivation();

  } else if (state.status === 'ACTIF') {

    showDashboard();

  } else if (state.status === 'DESACTIVE') {

    showError(

      'Cette carte EAH SPORT a été désactivée. ' +

      'Veuillez contacter votre coach.'

    );

  } else {

    showError(

      'Carte introuvable ou statut non reconnu.'

    );

  }

}


/************************************************************
 * 22. LANCEMENT AUTOMATIQUE DU SITE
 ************************************************************/

async function init() {

  if (requestPending) return;

  if (!token) {

    showWelcome();

    return;

  }

  requestPending = true;

  loading(
    'Connexion à votre espace EAH SPORT…'
  );

  try {

    state = await callAPI('read');

    routeState();

  } catch(error) {

    showError(error.message);

  } finally {

    requestPending = false;

  }

}

init();

</script>
