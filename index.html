
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071321">
<meta name="referrer" content="no-referrer">

<title>EAH SPORT | Personal Coaching Experience</title>

<style>

:root{
  --bg:#07111e;
  --panel:#101f32;
  --panel2:#162b43;
  --blue:#087ff5;
  --light:#78bfff;
  --white:#ffffff;
  --muted:#9db2c9;
  --border:#263e58;
  --green:#39d99a;
  --orange:#ffb45b;
  --red:#ff7777;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth;scroll-padding-top:100px}

body{
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

button,input,select{font:inherit}

button,a,input,select{
  -webkit-tap-highlight-color:transparent;
}

button{cursor:pointer}

button:disabled{opacity:.5;cursor:wait}

a{color:var(--light);text-decoration:none}

h1,h2,h3,p{margin-top:0}

h1{
  font-size:clamp(38px,6vw,76px);
  line-height:1.08;
  letter-spacing:-2px;
  margin-bottom:22px;
}

h2{
  font-size:clamp(26px,4vw,40px);
  line-height:1.2;
  letter-spacing:-.8px;
  margin-bottom:12px;
}

h3{font-size:21px;margin-bottom:8px}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,17,30,.96);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  padding:16px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
  color:white;
  flex-shrink:0;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.brand-title{
  font-size:29px;
  font-weight:900;
  letter-spacing:3px;
  line-height:1.2;
}

.brand-title span{color:var(--blue)}

.brand-subtitle{
  font-size:9px;
  letter-spacing:1.6px;
  color:var(--muted);
}

.header-nav{
  display:flex;
  align-items:center;
  gap:24px;
}

.header-nav a{
  color:#d0deec;
  font-size:13px;
  font-weight:700;
}

.header-nav a:hover{color:var(--light)}

.status{
  font-size:11px;
  color:var(--green);
  white-space:nowrap;
}

main{
  max-width:1450px;
  margin:auto;
  padding:24px 25px 70px;
  min-height:80vh;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2.4px;
  font-weight:800;
  color:var(--light);
  text-transform:uppercase;
}

.muted{color:var(--muted)}

.small{font-size:12px}

.hero{
  position:relative;
  overflow:hidden;
  min-height:510px;
  display:flex;
  align-items:center;
  padding:65px;
  border:1px solid var(--border);
  border-radius:26px;
  background:
    linear-gradient(
      90deg,
      rgba(5,15,28,.99) 0%,
      rgba(5,15,28,.93) 32%,
      rgba(5,15,28,.45) 75%,
      rgba(5,15,28,.25) 100%
    ),
    url('images/bandeau-sport.webp') center/cover,
    linear-gradient(135deg,#122a45,#15579a);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:700px;
}

.hero h1 span{color:var(--light)}

.hero p{
  max-width:570px;
  font-size:17px;
  color:#bdcde0;
}

.hero .eyebrow{margin-bottom:20px}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:14px 23px;
  border:1px solid transparent;
  border-radius:10px;
  background:linear-gradient(135deg,#1995ff,#0865d2);
  color:white;
  font-size:13px;
  font-weight:800;
  transition:.2s;
  text-decoration:none;
}

.btn:hover{
  filter:brightness(1.15);
  transform:translateY(-2px);
}

.btn-secondary{
  background:#142a42;
  border-color:#385470;
}

.full{width:100%}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:22px 0 55px;
}

.feature{
  display:flex;
  align-items:center;
  gap:18px;
  padding:25px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}

.feature-icon{
  width:50px;
  height:50px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:#153a60;
  border-radius:13px;
  color:var(--light);
}

.feature-icon svg{
  width:27px;
  height:27px;
}

.feature strong{
  display:block;
  font-size:19px;
}

.feature small{color:var(--muted)}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:25px 0;
}

.section-heading h2{margin:7px 0}

.search-bar{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:13px;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #35516e;
  background:#0b1a2a;
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #087ff522;
}

input::placeholder{color:#829ab3}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter-btn{
  padding:9px 17px;
  background:#112338;
  color:#b7cbe0;
  border:1px solid var(--border);
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

.filter-btn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}

.exercise-card{
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  overflow:hidden;
  transition:transform .25s,border-color .25s;
}

.exercise-card:hover{
  transform:translateY(-5px);
  border-color:#4d93d4;
}

.exercise-image-button{
  position:relative;
  display:block;
  width:100%;
  padding:0;
  border:0;
  background:#142d49;
  overflow:hidden;
  color:white;
}

.exercise-photo{
  width:100%;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
  transition:transform .4s;
}

.exercise-image-button:hover img{
  transform:scale(1.06);
}

.photo-placeholder{
  width:100%;
  aspect-ratio:4/3;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#1a416a,#0b1a2c);
  color:#72bbff;
}

.photo-placeholder svg{
  width:75px;
  height:75px;
}

.play-overlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.3));
}

.play-circle{
  display:grid;
  place-items:center;
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(4,13,24,.65);
  border:2px solid #ffffffcc;
  font-size:22px;
  padding-left:4px;
  backdrop-filter:blur(5px);
  transition:.2s;
}

.exercise-image-button:hover .play-circle{
  background:var(--blue);
  transform:scale(1.1);
}

.photo-label{
  position:absolute;
  bottom:13px;
  left:13px;
  background:rgba(0,0,0,.75);
  padding:6px 10px;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.exercise-body{
  padding:22px;
  flex:1;
  display:flex;
  flex-direction:column;
}

.exercise-body h3{margin-top:8px}

.exercise-description{
  color:var(--muted);
  font-size:13px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:42px;
}

.exercise-body .btn{margin-top:auto}

.muscles{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0 15px;
}

.muscle{
  background:#173c60;
  color:#a5d4ff;
  padding:5px 10px;
  border-radius:6px;
  font-size:11px;
}

.panel{
  padding:25px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  margin-bottom:20px;
}

.coaching-banner{
  margin-top:55px;
  padding:45px;
  display:grid;
  grid-template-columns:1.5fr 1fr;
  align-items:center;
  gap:30px;
  background:linear-gradient(135deg,#15385e,#102033);
  border:1px solid #31577d;
  border-radius:25px;
}

.nfc-card{
  width:100%;
  max-width:330px;
  aspect-ratio:1.586;
  margin:auto;
  padding:24px;
  border-radius:17px;
  border:1px solid #5684b5;
  background:
    radial-gradient(circle at 100% 0%,#287ac8,transparent 65%),
    linear-gradient(135deg,#081a32,#153c65);
  box-shadow:0 20px 40px #0006;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.nfc-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.nfc-card img{width:48px;height:48px;object-fit:contain}

.nfc-card-title{
  font-size:28px;
  letter-spacing:3px;
  font-weight:900;
}

.nfc-card-title span{color:var(--light)}

.nfc-symbol{
  font-size:24px;
  color:var(--light);
}

.nfc-card small{
  font-size:9px;
  letter-spacing:2px;
  color:#bed8f1;
}

.profile-hero{
  padding:35px;
  border-radius:23px;
  border:1px solid #315b88;
  background:linear-gradient(135deg,#17395e,#0b1a2c);
  margin-bottom:25px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:20px;
  margin:20px 0;
}

.profile-head h1{
  font-size:clamp(27px,5vw,45px);
  letter-spacing:-1px;
  margin:0;
}

.avatar{
  width:95px;
  height:95px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--light);
  background:#1c4269;
}

.avatar-placeholder{
  width:95px;
  height:95px;
  border-radius:50%;
  flex-shrink:0;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
  background:#1c4269;
  border:3px solid var(--light);
}

.coach-message{
  white-space:pre-wrap;
  border-left:3px solid var(--light);
  background:#ffffff0b;
  padding:18px;
  border-radius:0 10px 10px 0;
  margin:20px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#ffffff0c;
  border:1px solid #ffffff18;
  padding:17px;
  border-radius:12px;
}

.stat span{
  color:#bad0e7;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  font-size:clamp(20px,4vw,30px);
}

.member-nav{
  display:flex;
  gap:10px;
  margin:25px 0;
  overflow-x:auto;
}

.nav-btn{
  flex:1;
  min-width:max-content;
  padding:14px 18px;
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:10px;
  font-weight:bold;
}

.nav-btn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.session-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:22px;
}

.session-header{
  padding:25px;
  background:linear-gradient(135deg,#1a426d,#102238);
}

.session-content{padding:16px}

.session-exercise{
  background:#0b1b2d;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}

.session-exercise summary{
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  list-style:none;
}

.session-exercise summary::-webkit-details-marker{
  display:none;
}

.exercise-number{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  background:#1a3e65;
  color:var(--light);
  border-radius:10px;
  flex-shrink:0;
  font-weight:bold;
}

.summary-info{flex:1}

.summary-info strong{display:block}

.summary-info small{color:var(--muted)}

.details-body{
  padding:20px;
  border-top:1px solid var(--border);
}

.details-body .exercise-image-button{
  max-width:500px;
  border-radius:12px;
}

.table-wrap{
  overflow-x:auto;
  margin:15px 0;
}

table{
  width:100%;
  min-width:280px;
  border-collapse:collapse;
}

td,th{
  padding:12px 10px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:#1b4067;
  color:#b7dfff;
  font-size:11px;
  text-transform:uppercase;
}

td{font-size:14px}

tr:nth-child(even) td{background:#132b43}

.form-card{
  max-width:720px;
  margin:25px auto;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 16px;
}

.field{margin-bottom:18px}

label{
  display:block;
  margin-bottom:7px;
  color:#c9dbec;
  font-size:13px;
  font-weight:bold;
}

.activation-heading{
  text-align:center;
  margin-bottom:25px;
}

.activation-heading img{
  width:85px;
  margin-bottom:15px;
}

.photo-preview{
  display:none;
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--blue);
  margin:0 auto 20px;
}

.consent{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-weight:normal;
  color:var(--muted);
}

.consent input{width:auto;margin-top:5px}

.profile-line{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
  overflow-wrap:anywhere;
}

.profile-line span{color:var(--muted)}

.profile-line strong{text-align:right}

.empty{
  padding:35px 20px;
  border:1px dashed #365876;
  border-radius:14px;
  color:var(--muted);
  text-align:center;
}

.error{
  color:var(--red);
  overflow-wrap:anywhere;
}

.notice{
  padding:13px 16px;
  background:#122a43;
  border:1px solid #294968;
  border-radius:10px;
  color:#a9c6e1;
  font-size:12px;
  margin-bottom:20px;
}

.loading{
  padding:90px 20px;
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #24415e;
  border-top-color:var(--blue);
  border-radius:50%;
  margin:0 auto 20px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  padding:25px;
  background:#000c;
  backdrop-filter:blur(8px);
  overflow-y:auto;
}

.modal.open{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.modal-inner{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:28px;
  background:var(--panel);
  border:1px solid #375a7c;
  border-radius:22px;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.modal-top h2{margin:6px 0}

.modal-inner .exercise-photo{
  max-height:450px;
  border-radius:12px;
}

.close{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:1px solid var(--border);
  background:#1b3653;
  color:white;
  border-radius:10px;
  font-size:25px;
}

.video-frame{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
  background:#03080e;
  margin:15px 0;
}

.video-preview{
  padding:35px 20px;
  text-align:center;
  background:#081421;
  border:1px solid var(--border);
  border-radius:12px;
  margin:15px 0;
}

footer{
  padding:45px 20px;
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
}

footer img{width:65px;margin-bottom:10px}

footer strong{
  color:white;
  font-size:20px;
  letter-spacing:3px;
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  margin:20px 0;
}

[hidden]{display:none!important}

@media(max-width:1000px){

  .header-nav{gap:12px}

  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}

  .hero{padding:45px;min-height:440px}

  .feature{padding:18px;gap:12px}

  .feature strong{font-size:16px}

}

@media(max-width:700px){

  main{padding:14px 12px 40px}

  .header-inner{padding:12px;flex-wrap:wrap;gap:10px}

  .brand img{width:43px;height:43px}

  .brand-title{font-size:22px}

  .brand-subtitle{font-size:7px}

  .header-nav{
    width:100%;
    justify-content:space-between;
    overflow-x:auto;
    padding:5px 0;
  }

  .header-nav a{font-size:11px;white-space:nowrap}

  .status{font-size:9px}

  .hero{
    min-height:430px;
    padding:27px;
    border-radius:18px;
    background:
      linear-gradient(90deg,#071321ed,#07132177),
      url('images/bandeau-sport.webp') center/cover,
      linear-gradient(135deg,#122a45,#15579a);
  }

  .hero p{font-size:14px}

  .hero-buttons{flex-direction:column}

  .features{gap:7px;margin-bottom:35px}

  .feature{
    flex-direction:column;
    text-align:center;
    padding:12px 5px;
    gap:7px;
  }

  .feature-icon{width:38px;height:38px}

  .feature-icon svg{width:21px;height:21px}

  .feature strong{font-size:13px}

  .feature small{font-size:10px}

  .grid{gap:12px}

  .exercise-body{padding:13px}

  .exercise-body h3{font-size:17px}

  .exercise-body .eyebrow{font-size:8px}

  .exercise-description{font-size:11px}

  .exercise-body .btn{padding:10px 5px;font-size:11px}

  .muscle{font-size:9px;padding:4px 6px}

  .play-circle{width:43px;height:43px;font-size:17px}

  .photo-label{font-size:7px;left:7px;bottom:7px}

  .search-bar{grid-template-columns:1fr}

  .coaching-banner{
    grid-template-columns:1fr;
    padding:25px;
    margin-top:35px;
  }

  .section-heading{align-items:flex-start}

  .section-heading .btn{padding:10px;font-size:11px}

  .profile-hero{padding:20px}

  .avatar,.avatar-placeholder{width:68px;height:68px}

  .profile-head{gap:13px}

  .stat{padding:12px 8px}

  .stats{gap:7px}

  .form-grid{grid-template-columns:1fr}

  .panel{padding:18px}

  .modal{padding:10px}

  .modal-inner{padding:17px}

  .nav-btn{font-size:12px;padding:12px}

  .session-content{padding:10px}

  .details-body{padding:12px}

}

</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="brand" href="#accueil">
      <img src="logo.png" alt="EAH Conformité"
        onerror="this.hidden=true">
      <div>
        <div class="brand-title">
          EAH <span>SPORT</span>
        </div>
        <div class="brand-subtitle">
          PERSONAL COACHING EXPERIENCE
        </div>
      </div>
    </a>

    <div class="status" id="connection">
      ● EAH SPORT
    </div>

    <nav class="header-nav" id="headerNav">
      <a href="#accueil">Accueil</a>
      <a href="#exercices">Exercices</a>
      <a href="#coaching">Coaching</a>
      <a href="#coaching">Espace membre</a>
    </nav>

  </div>
</header>

<main id="app">
  <div class="loading">
    <div class="spinner"></div>
    Chargement de EAH SPORT…
  </div>
</main>

<footer>

  <img src="logo.png" alt="EAH"
    onerror="this.hidden=true">

  <div><strong>EAH SPORT</strong></div>

function esc(value){

  return String(value ?? '').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );

}

function normalize(value){

  return String(value ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();

}

function first(object,keys,fallback=''){

  for(const key of keys){

    if(
      object &&
      object[key]!==undefined &&
      object[key]!==null &&
      object[key]!==''
    ){
      return object[key];
    }

  }

  return fallback;

}

function safeUrl(value){

  try{

    const u=new URL(String(value||''));

    return u.protocol==='https:' ? u.href : '';

  }catch{

    return '';

  }

}

function isActive(value){

  return [
    'true','1','oui','actif','active','activee'
  ].includes(normalize(value));

}

function imageUrl(value){

  const url=safeUrl(value);

  if(url){

    const u=new URL(url);

    if(u.hostname==='drive.google.com'){

      const match=u.pathname.match(/\/file\/d\/([\w-]+)/);

      const id=match
        ? match[1]
        : u.searchParams.get('id');

      if(id && /^[\w-]+$/.test(id)){

        return 'https://drive.google.com/thumbnail?id='+
          encodeURIComponent(id)+'&sz=w1200';

      }

    }

    return url;

  }

  const relative=String(value||'');

  if(/^images\/[a-zA-Z0-9_.-]+\.(webp|jpg|jpeg|png)$/i.test(relative)){

    return new URL(relative,SITE).href;

  }

  return '';

}

function safeAvatar(value){

  const v=String(value||'');

  if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)){
    return v;
  }

  return imageUrl(v);

}

function setStatus(message,color){

  connection.textContent='● '+message;

}

function splitMuscles(value){

}

function muscleTags(value){

function normalizeExercise(e){

  const nom=first(e,[
    'nom','NOM','exercice','EXERCICE',
    'name','NOM_EXERCICE'
  ]);

  const fallback=DEFAULT_EXERCISES.find(
    x=>normalize(x.nom)===normalize(nom)
  )||{};

  const groupes=first(e,[
    'groupes','GROUPES','muscles',
    'GROUPES_MUSCULAIRES'
  ],fallback.groupes||'');

  return {

    nom,

    groupes,

    categorie:first(e,[
      'categorie','CATEGORIE','category'
    ],fallback.categorie||'Autres'),

    description:first(e,[
      'description','DESCRIPTION'
    ],fallback.description||''),

    photo:first(e,[
      'photo','PHOTO','image','IMAGE',
      'photoUrl','URL_PHOTO','PHOTO_URL',
      'URL_IMAGE'
    ],fallback.photo||''),

    video:first(e,[
      'video','VIDEO','videoUrl',
      'URL_VIDEO','VIDEO_URL'
    ])

  };

}

function normalizeProfile(p){

  return {

    id:first(p,['id','ID','identifiant','IDENTIFIANT']),

    nom:first(p,['nom','NOM','lastName']),

    prenom:first(p,['prenom','PRENOM','firstName']),

    poids:first(p,['poids','POIDS','weight']),

    age:first(p,['age','AGE']),

    taille:first(p,['taille','TAILLE','height']),

    coach:first(p,['coach','COACH']),

    email:first(p,['email','EMAIL','mail','MAIL']),

    photo:first(p,[
      'photo','PHOTO','photoUrl','PHOTO_URL'
    ]),

    message:first(p,[
      'message','MESSAGE','messageCoach','MESSAGE_COACH'
    ])

  };

}

function normalizeSession(s){

  return {

    nom:first(s,[
      'nom','seance','SEANCE','session','NOM_SEANCE'
    ]),

    exercice:first(s,['exercice','EXERCICE','exercise']),

    groupes:first(s,['groupes','GROUPES','muscles']),

    video:first(s,['video','VIDEO','videoUrl','URL_VIDEO']),

    photo:first(s,['photo','PHOTO','image','URL_PHOTO']),

    description:first(s,['description','DESCRIPTION']),

    series:first(s,['series','SERIES','sets']),

    reps:first(s,[
      'reps','REPS','repetitions','REPETITIONS'
    ]),

    charges:first(s,[
      'charges','CHARGES','charge','CHARGE','poids','POIDS'
    ]),

    repos:first(s,[
      'repos','REPOS','recuperation','RECUPERATION','rest'
    ]),

    notes:first(s,[
      'notes','NOTES','consignes','CONSIGNES'
    ])

  };

}

function normalizeExerciseList(list){

  if(!Array.isArray(list))return [];

  return list.filter(e=>{

    const active=first(e,[
      'active','ACTIVE','actif','ACTIF'
    ],null);

    return active===null||isActive(active);

  }).map(normalizeExercise).filter(e=>e.nom);

}

function normalizeResponse(result){

  const payload=
    result.data &&
    typeof result.data==='object' &&
    !Array.isArray(result.data)

    ? {...result,...result.data}

    : result;

  const profile=
    payload.profil ||
    payload.profile ||
    payload.user ||
    payload.utilisateur ||
    null;

  const rawStatus=normalize(first(
    payload,
    ['status','statut','STATUS','STATUT'],
    profile
      ? first(profile,['status','statut','STATUS','STATUT'])
      : ''
  ));

  let status=rawStatus.toUpperCase();

  if([
    'active','actif','activee','activated'
  ].includes(rawStatus)){
    status='ACTIF';
  }

  if([
    'disponible','available','libre','inactive','non active'
  ].includes(rawStatus)){
    status='DISPONIBLE';
  }

  if([
    'desactive','desactivee','disabled','bloque'
  ].includes(rawStatus)){
    status='DESACTIVE';
  }

  const sessionList=payload.sessions||payload.seances||[];

  return {

    status,

    id:first(payload,['id','ID','identifiant']),

    coach:first(payload,['coach','COACH']),

    profil:profile?normalizeProfile(profile):null,

    exercises:normalizeExerciseList(
      payload.exercises||payload.exercices||[]
    ),

    sessions:Array.isArray(sessionList)

      ? sessionList.filter(s=>{

          const active=first(s,[
            'active','ACTIVE','actif','ACTIF'
          ],null);

          return active===null||isActive(active);

        }).map(normalizeSession)
          .filter(s=>s.nom&&s.exercice)

      : []

  };

}


/************************************************************
 * 6. COMMUNICATION APPS SCRIPT
 ************************************************************/

async function requestJSON(url,options={},timeout=45000){

  const controller=new AbortController();

  const timer=setTimeout(
    ()=>controller.abort(),
    timeout
  );

  try{

    const response=await fetch(url,{

      ...options,

      redirect:'follow',

      credentials:'omit',

      cache:'no-store',

      signal:controller.signal

    });

    if(!response.ok){

      throw new Error('Erreur serveur : '+response.status);

    }

    const raw=await response.text();

    let result;

    try{

      result=JSON.parse(raw);

    }catch{

      throw new Error('Réponse Apps Script non valide.');

    }

    if(
      !result ||
      result.ok===false ||
      result.success===false
    ){

      throw new Error(
        result?.error ||
        result?.message ||
        'Requête refusée.'
      );

    }

    return result;

  }finally{

    clearTimeout(timer);

  }

}

async function callAPI(action,data={}){

  if(!/^[A-Za-z0-9_-]{20,160}$/.test(token)){

    throw new Error('Lien NFC invalide.');

  }

  const result=await requestJSON(API,{

    method:'POST',

    headers:{
      'Content-Type':'text/plain;charset=UTF-8'
    },

    body:JSON.stringify({

      action,

      token,

      data

    })

  });

  return normalizeResponse(result);

}

 *
 * Aucun token individuel n'est utilise.

function extractPublicExercises(result){

  const payload=result.data||result;

  const list=Array.isArray(payload)

    ? payload

    : payload.exercises||payload.exercices;

  if(!Array.isArray(list)){

    throw new Error('Bibliothèque publique indisponible.');

  }

  return normalizeExerciseList(list);

}

async function loadPublicExercises(){

  if(publicLoading)return;

  publicLoading=true;

  publicSynced=false;

  const syncButton=document.getElementById('publicRefresh');

  if(syncButton)syncButton.disabled=true;

  try{

    let result;

    try{

      result=await requestJSON(
        API+'?action=exercises',
        {method:'GET'},
        12000
      );

      exercises=extractPublicExercises(result);

    }catch{

      result=await requestJSON(API,{

        method:'POST',

        headers:{
          'Content-Type':'text/plain;charset=UTF-8'
        },

        body:JSON.stringify({
          action:'exercises'
        })

      },12000);

      exercises=extractPublicExercises(result);

    }

    publicSynced=true;

  }catch{

    exercises=DEFAULT_EXERCISES.map(e=>({...e}));

    publicSynced=false;

  }finally{

    publicLoading=false;

    if(syncButton)syncButton.disabled=false;

    if(document.getElementById('exerciseList')){

      updateLibraryFilters();

      renderExerciseList();

      updatePublicNotice();

    }

    const counter=document.getElementById('exerciseCount');

    if(counter)counter.textContent=exercises.length;

  }

}

function updatePublicNotice(){

  const notice=document.getElementById('publicNotice');

  if(!notice)return;

  if(publicLoading){

    notice.hidden=false;

    notice.textContent=
      'Synchronisation de la bibliothèque sportive…';

  }else if(publicSynced){

  }else{

    notice.hidden=false;

    notice.textContent=
      'Bibliothèque de découverte. Les tutoriels du coach seront disponibles lorsque la synchronisation publique sera activée.';

  }

}

function updateLibraryFilters(){

  const select=document.getElementById('muscleFilter');

  const filters=document.getElementById('categoryFilters');

  if(!select||!filters)return;

  const selected=select.value;

  const muscles=[...new Set(
    exercises.flatMap(e=>splitMuscles(e.groupes))
  )].sort((a,b)=>a.localeCompare(b,'fr'));

  select.innerHTML=`

    <option value="">
      Tous les groupes musculaires
    </option>

    ${muscles.map(m=>`

      <option value="${esc(m)}">
        ${esc(m)}
      </option>

    `).join('')}

  `;

  if(muscles.includes(selected))select.value=selected;

  const categories=[
    'Tous',
    ...new Set(exercises.map(e=>e.categorie).filter(Boolean))
  ];

  if(!categories.includes(currentFilter))currentFilter='Tous';

  filters.innerHTML=categories.map(c=>`

    <button
      class="filter-btn ${c===currentFilter?'active':''}"
      data-category="${esc(c)}"
    >
      ${esc(c)}
    </button>

  `).join('');

  filters.querySelectorAll('[data-category]').forEach(btn=>{

    btn.onclick=()=>{

      currentFilter=btn.dataset.category;

      filters.querySelectorAll('button').forEach(b=>{

        b.classList.toggle(
          'active',
          b.dataset.category===currentFilter

      });

      renderExerciseList();

    };

  });

}

function renderExerciseList(){

  const container=document.getElementById('exerciseList');

  if(!container)return;

  const q=normalize(
    document.getElementById('exerciseSearch')?.value
  );

  const muscle=normalize(
    document.getElementById('muscleFilter')?.value
  );

  const list=exercises.map((e,index)=>({...e,index}))

    .filter(e=>{

      const text=normalize(
        e.nom+' '+e.groupes+' '+e.description
      );

      const groups=splitMuscles(e.groupes).map(normalize);

      return text.includes(q) &&

        (!muscle||groups.includes(muscle)) &&

        (currentFilter==='Tous'||
          e.categorie===currentFilter);

    });

  document.getElementById('resultCount').textContent=
    list.length+' exercice(s) disponible(s)';

  container.innerHTML=list.length

    ? list.map(e=>`

    : `

}

function videoHTML(value){

  const link=safeUrl(value);

  if(!link){

    return `

      <div class="video-preview">

        <div style="font-size:40px;color:#72bbff">
          ▶
        </div>

        <h3>Tutoriel bientôt disponible</h3>

        <p class="small muted">
          La vidéo sera affichée lorsque son lien
          sera disponible.
        </p>

      </div>

    `;

  }

  const u=new URL(link);

  const host=u.hostname.toLowerCase();

  let embed='';
  let id='';
  let platform='la vidéo';

  if(host==='youtu.be'){

    id=u.pathname.split('/')[1]||'';

  }

  if([
    'youtube.com',
    'www.youtube.com',
    'm.youtube.com',
    'www.youtube-nocookie.com'
  ].includes(host)){

    id=u.searchParams.get('v')||'';

    if(!id){

      const match=u.pathname.match(
        /^\/(?:shorts|embed|live)\/([\w-]+)/
      );

      if(match)id=match[1];

    }

  }

  if(/^[A-Za-z0-9_-]{11}$/.test(id)){

    platform='YouTube';

    embed='https://www.youtube-nocookie.com/embed/'+id;

  }

  if(host==='drive.google.com'){

    platform='Google Drive';

    const match=u.pathname.match(/\/file\/d\/([\w-]+)/);

    const driveId=match
      ? match[1]
      : u.searchParams.get('id');

    if(driveId&&/^[\w-]+$/.test(driveId)){

      embed='https://drive.google.com/file/d/'+
        driveId+'/preview';

    }

  }

  if([
    'vimeo.com',
    'www.vimeo.com',
    'player.vimeo.com'
  ].includes(host)){

    platform='Vimeo';

    const match=u.pathname.match(/\/(\d+)(?:\/|$)/);

    if(match){

      embed='https://player.vimeo.com/video/'+match[1];

    }

  }

  if(/\.(mp4|webm|ogg)$/i.test(u.pathname)){

    return `

      <video
        class="video-frame"
        src="${esc(link)}"
        controls
        playsinline
        preload="metadata"
      ></video>

      <a class="btn btn-secondary"
        href="${esc(link)}"
        target="_blank"
        rel="noopener noreferrer">
        Ouvrir la vidéo
      </a>

    `;

  }

  if(
    host==='instagram.com'||
    host.endsWith('.instagram.com')
  ){
    platform='Instagram';
  }

  if(
    host==='tiktok.com'||
    host.endsWith('.tiktok.com')
  ){
    platform='TikTok';
  }

  if(
    host==='facebook.com'||
    host.endsWith('.facebook.com')
  ){
    platform='Facebook';
  }

  return `

    ${embed?`

      <iframe
        class="video-frame"
        src="${esc(embed)}"
        title="Tutoriel sportif"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="encrypted-media;fullscreen;picture-in-picture"
        allowfullscreen
      ></iframe>

    `:`

      <div class="video-preview">

        <div style="font-size:40px;color:#72bbff">
          ▶
        </div>

        <h3>Tutoriel ${esc(platform)}</h3>

        <p class="muted small">
          Consultez la vidéo sur sa plateforme d'origine.
        </p>

      </div>

    `}

    <a class="btn"
      href="${esc(link)}"
      target="_blank"
      rel="noopener noreferrer">

      ▶ Ouvrir ${esc(platform)}

    </a>

  `;

}

/************************************************************
 * 12. COMPRESSION DE LA PHOTO DE PROFIL
 ************************************************************/

async function compressImage(file){

  if(!file)return '';

  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){

    throw new Error('Choisissez une photo JPG, PNG ou WEBP.');

  }

  if(file.size>15000000){

    throw new Error('Photo trop volumineuse.');

  }

  const url=URL.createObjectURL(file);

  try{

    const img=await new Promise((resolve,reject)=>{

      const i=new Image();

      i.onload=()=>resolve(i);

      i.onerror=()=>reject(new Error('Photo illisible.'));

      i.src=url;

    });

    const ratio=Math.min(
      1,
      CONFIG.PHOTO_DIMENSION/Math.max(img.width,img.height)
    );

    const canvas=document.createElement('canvas');

    canvas.width=Math.max(1,Math.round(img.width*ratio));

    canvas.height=Math.max(1,Math.round(img.height*ratio));

    const ctx=canvas.getContext('2d');

    ctx.fillStyle='#ffffff';

    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    let quality=.85;

    let result=canvas.toDataURL('image/jpeg',quality);

    while(
      result.length*.75>CONFIG.MAX_PHOTO_SIZE&&
      quality>.3
    ){

      quality-=.1;

      result=canvas.toDataURL('image/jpeg',quality);

    }

    if(result.length*.75>CONFIG.MAX_PHOTO_SIZE){

      throw new Error('Impossible de compresser la photo.');

    }

    return result;

  }finally{

    URL.revokeObjectURL(url);

  }

}

/************************************************************
 * 15. SERIES, REPETITIONS ET CHARGES
 ************************************************************/

function splitValues(value){

  if(Array.isArray(value))return value.map(String);

  return String(value??'')
    .split(/[\/;\n]/)
    .map(v=>v.trim());

}

function seriesTable(session){

  const count=Math.min(
    100,
    Math.max(0,Math.floor(Number(session.series)||0))
  );

  const reps=splitValues(session.reps);

  const charges=splitValues(session.charges);

  const rests=splitValues(session.repos);

  function at(values,index){

    return values.length===1

      ? values[0]||'—'

      : values[index]||'—';

  }

  function unit(value,suffix){

    return /^\d+(?:[.,]\d+)?$/.test(value)

      ? value+' '+suffix

      : value;

  }

  if(!count){

    return '<p class="muted small">Séries non renseignées.</p>';

  }

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Série</th>

            <th>Répétitions</th>

            <th>Charge</th>

            <th>Repos</th>

          </tr>

        </thead>

        <tbody>

          ${Array.from({length:count},(_,i)=>`

            <tr>

              <td style="color:#72bbff;font-weight:bold">
                ${i+1}
              </td>

              <td>${esc(at(reps,i))}</td>

              <td>${esc(unit(at(charges,i),'kg'))}</td>

              <td>${esc(unit(at(rests,i),'s'))}</td>

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>

  `;

}

      <button class="btn btn-secondary" id="refreshBtn">
        ↻ Actualiser
      </button>

    </div>

    ${!grouped.size?`

      <div class="empty">

        <h3>Aucune séance attribuée</h3>

        <p>
          Votre coach pourra vous transmettre
          votre programme personnalisé.
        </p>

        <button class="btn" id="libraryBtn">
          Découvrir les exercices
        </button>

      </div>

    `:''}

    ${[...grouped].map(([name,items],sessionIndex)=>`

      <article class="session-card">

        <div class="session-header">

          <div class="eyebrow">

            PROGRAMME
            ${String(sessionIndex+1).padStart(2,'0')}

          </div>

          <h3 style="font-size:27px;margin-top:10px">
            ${esc(name)}
          </h3>

          <span class="small muted">

            ${items.length} exercice(s)

            · ${items.reduce(
              (sum,item)=>sum+(Number(item.series)||0),0
            )} séries

          </span>

        </div>

        <div class="session-content">

          ${items.map((s,i)=>{

            const index=exercises.findIndex(
              e=>normalize(e.nom)===normalize(s.exercice)
            );

            const ref=exercises[index]||{};

            const photo=ref.photo||s.photo;

            const video=ref.video||s.video;

            const groupes=ref.groupes||s.groupes;

            return `

              <details class="session-exercise">

                <summary>

                  <div class="exercise-number">
                    ${String(i+1).padStart(2,'0')}
                  </div>

                  <div class="summary-info">

                    <strong>${esc(s.exercice)}</strong>

                    <small>

                      ${esc(s.series)} séries

                      · ${esc(groupes)}

                    </small>

                  </div>

                  <span style="color:#72bbff">⌄</span>

                </summary>

                <div class="details-body">

                  ${muscleTags(groupes)}

                  ${index>=0

                    ? clickablePhoto(ref,index)

                    : exerciseImage(photo,s.exercice)

                  }

                  <p class="muted" style="margin-top:15px">

                    ${esc(ref.description||s.description)}

                  </p>

                  <div class="eyebrow">
                    VOTRE PROGRAMMATION
                  </div>

                  ${seriesTable(s)}

                  ${s.notes?`

                    <div class="coach-message">

                      <div class="eyebrow">
                        CONSIGNES DU COACH
                      </div>

                      ${esc(s.notes)}

                    </div>

                  `:''}

                  <div class="eyebrow">
                    TUTORIEL VIDÉO
                  </div>

                  <div class="session-video"
                    data-video="${esc(video)}"></div>

                </div>

              </details>

            `;

          }).join('')}

        </div>

      </article>

    `).join('')}

  `;

  document.getElementById('refreshBtn').onclick=refreshData;

  const libraryBtn=document.getElementById('libraryBtn');

  if(libraryBtn){

    libraryBtn.onclick=()=>{

      currentTab='exercises';

      renderTab();

    };

  }

  content.querySelectorAll('.session-exercise')
    .forEach(details=>{

      details.addEventListener('toggle',()=>{

        const container=details.querySelector('.session-video');

        if(container){

          container.innerHTML=details.open

            ? videoHTML(container.dataset.video)

            : '';

        }

      });

    });

}


/************************************************************
 * 17. MON PROFIL
 ************************************************************/

function showProfile(){

  const p=state.profil;

  const fields=[

    ['Identifiant EAH',p.id||state.id],

    ['Nom',p.nom],

    ['Prénom',p.prenom],

    ['Poids',(p.poids||'—')+' kg'],

    ['Âge',(p.age||'—')+' ans'],

    ['Taille',(p.taille||'—')+' cm'],

    ['Coach',p.coach],

    ['Email',p.email],

    ['Statut','Carte active']

  ];

  document.getElementById('memberContent').innerHTML=`

    <section class="panel">

      <div class="eyebrow">
        INFORMATIONS PERSONNELLES
      </div>

      <h2 style="margin-top:12px">Mon profil sportif</h2>

      ${fields.map(([label,value])=>`

        <div class="profile-line">

          <span>${esc(label)}</span>

          <strong>${esc(value)}</strong>

        </div>

      `).join('')}

      <p class="small muted" style="margin-top:20px">

        Pour modifier vos informations,
        contactez votre coach.

      </p>

      <button class="btn btn-secondary" id="refreshProfile">

        ↻ Actualiser mon profil

      </button>

    </section>

    <section class="panel">

      <div class="eyebrow">
        CONFIDENTIALITÉ
      </div>

      <h3 style="margin-top:10px">
        Votre carte personnelle
      </h3>

      <p class="muted">

        Votre lien NFC donne accès à votre profil.
        Ne le partagez pas avec des personnes
        non autorisées.

      </p>

      <a class="btn btn-secondary" href="${SITE}">
        Retour à l'accueil public
      </a>

    </section>

  `;

  document.getElementById('refreshProfile').onclick=refreshData;

}


/************************************************************
 * 18. ACTUALISATION ET ETAT DES CARTES
 ************************************************************/

async function refreshData(){

  if(requestPending)return;

  requestPending=true;

  closeModal();

  loading('Actualisation de votre espace sportif…');

  try{

    state=await callAPI('read');

    routeState();

  }catch(error){

    showError(error.message);

  }finally{

    requestPending=false;

  }

}

function routeState(){

  if(state.status==='DISPONIBLE'){

    showActivation();

  }else if(state.status==='ACTIF'){

    showDashboard();

  }else if(state.status==='DESACTIVE'){

    showError(
      'Cette carte a été désactivée. Contactez votre coach.'
    );

  }else{

    showError('Carte introuvable ou statut non reconnu.');

  }

}


/************************************************************
 * 19. LANCEMENT DU SITE
 *
 * Sans token : accueil public et exercices.
 * Avec token : espace NFC personnel.
 ************************************************************/

async function init(){

  if(requestPending)return;

  if(!token){

    showPublicHome();

    return;

  }

  requestPending=true;

  loading('Connexion à votre espace EAH SPORT…');

  try{

    state=await callAPI('read');

    routeState();

  }catch(error){

    showError(error.message);

  }finally{

    requestPending=false;

  }

}

init();

</script>
